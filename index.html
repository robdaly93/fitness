<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITLOG</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0 }
:root{
  --paper:#efe9da; --card:#f7f1e3; --white:#ffffff;
  --ink:#1a1610; --muted:#6b6555; --faint:#a39a86;
  --hairline:#ece4d2; --dash:#cabfa6; --grid-empty:#e3dccb;
  --red:#e5431e; --gold:#f4a800; --blue:#2e44c8; --green:#1e8a63;
  --purple:#9b5de5; --amber:#b87d00;
  --scrim:rgba(26,22,16,0.6);
  --on-ink-dim:rgba(239,233,218,0.75);
}
html,body{ height:100%; margin:0; overflow:hidden; background:var(--paper); color:var(--ink);
  font-family:'Archivo',sans-serif; -webkit-font-smoothing:antialiased }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit }
input,textarea,select{ font-family:inherit; color:inherit }
input::placeholder,textarea::placeholder{ color:var(--faint) }
a{ color:inherit; text-decoration:none }
.hidden{ display:none !important }

@keyframes barGrow{ from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes popUp{ from{transform:translateY(16px)} to{transform:translateY(0)} }
@keyframes scrimIn{ from{opacity:0} to{opacity:1} }
@keyframes sheetIn{ from{transform:translateY(24px)} to{transform:translateY(0)} }
@keyframes drawerIn{ from{transform:translateX(100%)} to{transform:translateX(0)} }

/* ══ type helpers ══ */
.d{ font-family:'Big Shoulders Display',sans-serif; font-weight:900 }
.lbl{ font-weight:800; font-size:12px; letter-spacing:0.16em }
.lbl-s{ font-weight:800; font-size:11px; letter-spacing:0.14em }
.lbl-m{ font-weight:800; font-size:12px; letter-spacing:0.12em }
.dim{ color:var(--muted) }
.on-dim{ color:var(--on-ink-dim) }

/* ══ shell ══ */
.app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; position:relative }
/* ?embed=1: the host page (robert-hub) supplies the header and tabs. */
.embed .hdr,.embed .bottom-nav{ display:none !important }
/* …and the document scrolls at its content height, so the host can size the iframe. */
html.embed,.embed body{ height:auto; overflow:visible }
.embed .app{ height:auto; min-height:0; overflow:visible }

/* ══ header ══ */
.hdr{ display:grid; grid-template-columns:auto 1fr auto; align-items:stretch;
  border-bottom:3px solid var(--ink); flex-shrink:0 }
.hdr-logo{ padding:16px 32px; border-right:3px solid var(--ink);
  display:flex; flex-direction:column; justify-content:center }
.wordmark{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:38px;
  line-height:0.8; letter-spacing:0.01em }
.wordmark-sub{ font-weight:800; font-size:10px; letter-spacing:0.3em; color:var(--muted); margin-top:5px }
.hdr-nav{ display:flex; align-items:stretch }
.tab{ font-weight:800; font-size:12px; letter-spacing:0.14em; padding:0 28px;
  border-right:3px solid var(--ink); background:transparent; color:var(--muted) }
.tab.active{ background:var(--ink); color:var(--paper) }
.hdr-right{ padding:0 32px; display:flex; align-items:center; gap:18px }
.sync-chips{ display:flex; gap:6px }
.chip-sync{ font-weight:800; font-size:10px; letter-spacing:0.12em; padding:5px 9px;
  border:2px solid var(--ink); background:transparent; color:var(--ink); white-space:nowrap }
.chip-sync.waiting{ border-style:dashed; border-color:var(--faint); color:var(--muted) }
.chip-sync.expired{ background:var(--red); border-color:var(--red); color:var(--paper) }
.ready-pill{ display:flex; align-items:center; gap:8px; border:2px solid var(--ink);
  border-radius:30px; padding:7px 14px; font-weight:800; font-size:11px; letter-spacing:0.1em;
  white-space:nowrap }
.ready-dot{ width:10px; height:10px; border-radius:50%; background:var(--c) }
.hdr-date{ font-weight:800; font-size:12px; letter-spacing:0.12em; white-space:nowrap }

/* ══ streak-at-risk banner ══ */
.banner{ background:var(--gold); border-bottom:3px solid var(--ink); padding:12px 32px;
  display:flex; align-items:center; gap:16px; flex-shrink:0 }
.banner-sq{ width:12px; height:12px; background:var(--ink); flex-shrink:0 }
.banner-txt{ font-weight:800; font-size:13px; letter-spacing:0.12em; flex:1 }
.banner-btn{ border:2px solid var(--ink); background:var(--ink); color:var(--paper);
  font-weight:800; font-size:12px; letter-spacing:0.1em; padding:8px 14px; white-space:nowrap }

/* ══ views ══ */
.view{ display:none; flex:1; min-height:0; flex-direction:column }
.view.active{ display:flex }
#view-today{ padding:24px 32px 28px; gap:16px; overflow-y:auto }
#view-training{ padding:32px 32px 64px; gap:40px; overflow-y:auto }
#view-goals{ padding:32px 32px 64px; gap:16px; overflow-y:auto }
#view-notes{ padding:32px 32px 64px; gap:20px; overflow-y:auto }

.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px }
.page-title{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:54px; line-height:0.8 }
.page-sub{ font-weight:800; font-size:12px; letter-spacing:0.12em; color:var(--muted); margin-top:8px }
.head-btns{ display:flex; gap:10px; flex-shrink:0 }
.btn-ghost{ border:2px solid var(--ink); font-weight:800; font-size:12px; letter-spacing:0.1em; padding:12px 18px }
.btn-red{ background:var(--red); color:var(--paper); border:2px solid var(--ink);
  font-weight:800; font-size:12px; letter-spacing:0.1em; padding:12px 22px }
.btn-ink{ background:var(--ink); color:var(--paper); border:2px solid var(--ink);
  font-weight:800; font-size:12px; letter-spacing:0.1em; padding:12px 22px }
.sec-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:16px }
.sec-head span{ font-weight:800; font-size:12px; letter-spacing:0.16em; color:var(--muted) }
.sec-head span.meta{ letter-spacing:0.12em }

/* ══ today: row 1 ══ */
.today-row1{ display:grid; grid-template-columns:minmax(0,1.85fr) minmax(0,1fr); gap:16px;
  flex:1; min-height:440px }
.hero{ background:var(--red); color:var(--paper); border:3px solid var(--ink);
  padding:24px 32px 26px; display:flex; flex-direction:column; min-width:0; animation:popUp .3s ease-out }
.hero-top{ display:flex; justify-content:space-between; gap:16px;
  font-weight:800; font-size:12px; letter-spacing:0.16em }
.hero-top-r{ display:flex; gap:12px; align-items:center; white-space:nowrap }
.hero-status{ padding:3px 8px; background:rgba(26,22,16,0.3); color:var(--paper) }
.hero-status.warn{ background:var(--gold); color:var(--ink) }
.hero-num{ display:flex; align-items:flex-end; gap:14px; margin-top:14px }
.hero-kg{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:204px;
  line-height:0.78; letter-spacing:-0.01em }
.hero-kg-unit{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:40px;
  line-height:1; padding-bottom:4px }
.hero-stats{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:22px;
  border-top:2px solid rgba(239,233,218,0.4); padding-top:14px }
.hero-stat-lbl{ font-weight:800; font-size:11px; letter-spacing:0.14em }
.hero-stat-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:44px;
  line-height:0.95; margin-top:4px }
.hero-barwrap{ margin-top:auto; padding-top:18px }
.hero-track{ position:relative; height:16px; background:rgba(26,22,16,0.28) }
.hero-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--paper); width:var(--pct);
  transform-origin:left; animation:barGrow .55s ease-out }
.hero-tick{ position:absolute; top:0; bottom:0; width:3px; background:var(--red);
  transform:translateX(-1px); left:var(--l) }
.hero-marker{ position:absolute; top:-6px; width:4px; height:28px; background:var(--ink);
  transform:translateX(-2px); left:var(--pct) }
.hero-scale{ position:relative; height:30px; margin-top:8px;
  font-weight:800; font-size:11px; letter-spacing:0.12em }
.hero-scale>.s{ position:absolute; left:0 }
.hero-scale>.e{ position:absolute; right:0 }
.hero-mark{ position:absolute; transform:translateX(-50%); text-align:center;
  white-space:nowrap; line-height:1.35; left:var(--l) }
.hero-mark i{ font-style:normal; font-size:10px; background:var(--ink); padding:1px 5px }
.hero-foot{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:18px }
.hero-foot-l{ display:flex; align-items:center; gap:14px; min-width:0 }
.hero-vel{ background:var(--ink); color:var(--paper); padding:8px 12px;
  font-weight:800; font-size:12px; letter-spacing:0.1em; white-space:nowrap }
.hero-vel i{ font-style:normal; color:var(--gold) }
.hero-eta{ font-weight:700; font-size:13px }
.hero-btn{ background:var(--paper); color:var(--ink); border:3px solid var(--ink);
  font-weight:800; font-size:13px; letter-spacing:0.1em; padding:12px 22px; white-space:nowrap }
.hero-btn.invert{ background:var(--ink); color:var(--paper) }

/* ══ today: evening card ══ */
.evening{ background:var(--ink); color:var(--paper); border:3px solid var(--ink);
  padding:24px 32px 26px; display:flex; flex-direction:column; min-width:0; animation:popUp .3s ease-out }
.evening-top{ display:flex; justify-content:space-between; align-items:center; gap:16px;
  font-weight:800; font-size:12px; letter-spacing:0.16em }
.evening-chip{ background:var(--gold); color:var(--ink); padding:3px 8px; white-space:nowrap }
.evening-num{ display:flex; align-items:flex-end; gap:16px; margin-top:14px }
.evening-big{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:204px;
  line-height:0.78; color:var(--gold) }
.evening-unit{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:40px;
  line-height:0.9; padding-bottom:4px }
.evening-text{ font-weight:600; font-size:16px; line-height:1.45; margin-top:26px;
  max-width:640px; text-wrap:pretty }
.evening-stats{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:auto;
  border-top:2px solid rgba(239,233,218,0.3); padding-top:14px }
.evening-foot{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:18px }
.evening-wt{ font-weight:800; font-size:12px; letter-spacing:0.1em; color:var(--on-ink-dim) }
.evening-btn{ background:var(--gold); color:var(--ink); border:3px solid var(--gold);
  font-weight:800; font-size:13px; letter-spacing:0.1em; padding:12px 22px; white-space:nowrap }

/* ══ today: right column ══ */
.today-right{ display:flex; flex-direction:column; gap:16px; min-width:0; min-height:0 }
.score-card{ background:var(--ink); color:var(--paper); border:3px solid var(--ink);
  padding:22px 26px; flex:1; min-height:0; overflow:hidden;
  display:flex; flex-direction:column; animation:popUp .3s ease-out }
.score-row{ display:flex; align-items:flex-end; justify-content:space-between; margin-top:10px; gap:12px }
.score-num{ display:flex; align-items:baseline; gap:10px }
.score-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:96px;
  line-height:0.8; color:var(--gold) }
.streak-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:44px; line-height:0.85 }
.strip-wrap{ margin-top:auto; padding-top:18px }
.strip{ display:grid; grid-template-columns:repeat(14,1fr); gap:4px }
.strip-cell{ aspect-ratio:1; background:var(--b) }
.strip-cell.is-today{ outline:2px solid var(--paper); outline-offset:2px }
.strip-cap{ display:flex; justify-content:space-between; margin-top:8px;
  font-weight:800; font-size:11px; letter-spacing:0.12em; color:var(--on-ink-dim) }
.recap-stats{ display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; margin-top:18px; min-height:0 }
.recap-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:52px;
  line-height:0.9; margin-top:4px; color:var(--gold) }
.recap-foot{ margin-top:auto; padding-top:14px; font-weight:800; font-size:12px; letter-spacing:0.12em }
.why-card{ background:var(--card); border:3px solid var(--ink); padding:22px 26px; flex:1;
  min-height:0; overflow:hidden; display:flex; flex-direction:column; animation:popUp .3s ease-out }
.why-text{ font-family:'Newsreader',serif; font-style:italic; font-size:clamp(20px,1.7vw,30px);
  line-height:1.3; margin-top:14px; text-wrap:pretty; min-height:0; overflow-y:auto }
.why-foot{ margin-top:auto; padding-top:14px; font-weight:600; font-size:12px; color:var(--muted) }
.ready-card{ background:var(--c); color:var(--paper); border:3px solid var(--ink);
  padding:18px 24px; flex-shrink:0 }
.ready-card-top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px }
.ready-verdict{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:34px; line-height:0.85 }
.ready-advice{ font-weight:700; font-size:14px; margin-top:6px }
.ready-stats{ display:flex; gap:28px; margin-top:12px; flex-wrap:wrap }
.ready-stat{ display:flex; align-items:baseline; gap:6px }
.ready-stat b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:24px; line-height:1 }
.ready-stat em{ font-style:normal; font-weight:700; font-size:11px }

/* ══ today: pillars ══ */
.log-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px }
.log-head span{ font-weight:800; font-size:12px; letter-spacing:0.16em; color:var(--muted) }
.log-head span.meta{ letter-spacing:0.12em }
.pillars{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; flex-shrink:0 }
.pillar{ border:3px solid var(--ink); padding:18px 20px 20px; display:flex; flex-direction:column;
  gap:10px; min-height:224px; background:var(--card); color:var(--ink); animation:popUp .3s ease-out }
.pillar.done{ background:var(--c); color:var(--fg) }
.pillar-top{ display:flex; align-items:center; justify-content:space-between; gap:10px }
.pillar-tag{ font-weight:800; font-size:10px; letter-spacing:0.12em; padding:4px 8px;
  border:2px solid currentColor; background:transparent; white-space:nowrap }
.pillar.done .pillar-tag{ background:var(--fg); color:var(--c); border-color:var(--fg) }
.pillar-num{ display:flex; align-items:baseline; gap:8px }
.pillar-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:64px; line-height:0.85 }
.pillar-val.na{ font-family:'Archivo',sans-serif; font-weight:800; font-size:40px; opacity:0.55 }
.pillar-unit{ font-weight:800; font-size:12px; letter-spacing:0.1em }
.pillar-sub{ font-weight:600; font-size:13px; line-height:1.35 }
.pillar-bar{ height:8px; background:#ddd5c2 }
.pillar.done .pillar-bar{ background:rgba(26,22,16,0.25) }
.pillar-bar i{ display:block; height:100%; background:var(--gold); width:var(--w);
  transform-origin:left; animation:barGrow .55s ease-out }
.pillar.done .pillar-bar i{ background:var(--fg) }
.pillar-btn{ margin-top:auto; padding:12px; font-weight:800; font-size:12px; letter-spacing:0.12em;
  background:var(--ink); color:var(--paper); border:2px solid var(--ink); text-align:center }
.pillar.done .pillar-btn{ background:transparent; color:var(--fg); border-color:var(--fg) }
.pillar-btn.cta{ background:var(--red); color:var(--paper); border-color:var(--ink) }
.pillar-btn.warn{ background:var(--red); color:var(--paper); border-color:var(--ink) }
.pillar-off{ grid-column:span 2; border:2px dashed var(--ink); color:var(--muted); padding:18px 20px;
  display:flex; align-items:center; justify-content:center; text-align:center }

/* ══ training: week strip ══ */
.week{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:12px }
.week-cell{ border:3px solid var(--ink); padding:14px 14px 16px; display:flex; flex-direction:column;
  gap:8px; min-height:132px; background:var(--card); color:var(--ink) }
.week-cell.is-today{ background:var(--ink); color:var(--paper) }
.week-cell-top{ display:flex; justify-content:space-between; gap:6px;
  font-weight:800; font-size:11px; letter-spacing:0.14em }
.week-cell-num{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:34px; line-height:0.85 }
.week-cell-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; align-items:flex-start }
.week-chip{ font-weight:800; font-size:11px; letter-spacing:0.1em; padding:4px 8px;
  background:transparent; color:var(--muted); border:2px solid transparent }
.week-extra{ font-weight:700; font-size:11px; letter-spacing:0.06em; color:var(--muted) }
.week-cell.is-today .week-extra{ color:var(--gold) }

/* ══ training: recent sessions ══ */
.sess-card{ border:3px solid var(--ink); background:var(--card) }
.sess-row{ padding:16px 20px; border-top:3px solid var(--ink) }
.sess-row:first-child{ border-top:none }
.sess-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap }
.sess-chip{ font-weight:800; font-size:12px; letter-spacing:0.1em; padding:5px 10px;
  background:var(--c); color:var(--fg); white-space:nowrap }
.sess-date{ font-weight:700; font-size:12px; letter-spacing:0.08em; color:var(--muted) }
.sess-meta{ margin-left:auto; font-weight:800; font-size:12px; letter-spacing:0.08em; white-space:nowrap }
.sess-table{ display:grid; grid-template-columns:minmax(0,1fr) 100px 180px; margin-top:14px }
.sess-th{ font-weight:800; font-size:11px; letter-spacing:0.14em; color:var(--muted); padding:6px 0 }
.sess-ex{ text-align:left; padding:8px 0; border-top:2px solid var(--hairline);
  font-weight:600; font-size:14px }
.sess-ex u{ border-bottom:2px dotted var(--faint); text-decoration:none }
.sess-kg{ padding:6px 0; border-top:2px solid var(--hairline);
  font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:22px }
.sess-reps{ padding:9px 0; border-top:2px solid var(--hairline);
  font-weight:700; font-size:13px; color:var(--muted) }
.sess-note{ font-style:italic; font-weight:500; font-size:14px; margin-top:10px; color:var(--muted) }

/* ══ training: year grid ══ */
.grid-card{ border:3px solid var(--ink); background:var(--card); padding:20px 24px;
  display:flex; gap:40px; align-items:flex-start }
.grid-scroll{ display:flex; gap:8px; min-width:0; overflow-x:auto }
.grid-days{ display:flex; flex-direction:column; gap:3px; padding-top:22px }
.grid-days div{ height:14px; line-height:14px; font-weight:800; font-size:10px; color:var(--muted) }
.grid-months{ position:relative; height:22px; font-weight:800; font-size:10px;
  letter-spacing:0.1em; color:var(--muted) }
.grid-months span{ position:absolute; left:var(--l) }
.grid-cols{ display:flex; gap:3px }
.grid-col{ display:flex; flex-direction:column; gap:3px }
.grid-cell{ width:14px; height:14px; background:var(--b) }
.grid-legend{ display:flex; flex-direction:column; gap:10px; margin-left:auto; min-width:170px }
.grid-legend-row{ display:flex; align-items:center; gap:10px }
.grid-legend-sw{ width:14px; height:14px; background:var(--c) }
.grid-legend-row span{ font-weight:800; font-size:12px; letter-spacing:0.12em; flex:1 }
.grid-legend-row b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:24px; line-height:1 }

/* ══ training: lift progression ══ */
.lifts{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px }
.lift-card{ border:3px solid var(--ink); background:var(--card); padding:18px 20px }
.lift-name{ font-weight:800; font-size:12px; letter-spacing:0.12em }
.lift-row{ display:flex; align-items:baseline; gap:6px; margin-top:10px }
.lift-cur{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:48px; line-height:0.85 }
.lift-unit{ font-weight:800; font-size:12px }
.lift-delta{ margin-left:auto; font-weight:800; font-size:12px; letter-spacing:0.06em;
  color:var(--ink); background:var(--c); padding:4px 8px; white-space:nowrap }
.lift-spark{ width:100%; height:40px; margin-top:14px; display:block; overflow:visible }

/* ══ training: running ══ */
.stat-strip{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  border:3px solid var(--ink); background:var(--card) }
.stat-cell{ padding:16px 20px; border-right:3px solid var(--ink) }
.stat-cell:last-child{ border-right:none }
.stat-cell .lbl-s{ color:var(--muted) }
.stat-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:40px;
  line-height:0.9; margin-top:6px }
.run-cards{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:16px }
.run-card{ border:3px solid var(--ink); padding:18px 20px; background:var(--card); color:var(--ink) }
.run-card.best{ background:var(--ink); color:var(--paper) }
.run-card-top{ display:flex; justify-content:space-between; gap:8px;
  font-weight:800; font-size:11px; letter-spacing:0.1em }
.run-card-top i{ font-style:normal; color:var(--gold) }
.run-time{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:48px;
  line-height:0.85; margin-top:10px }
.run-detail{ font-weight:700; font-size:12px; margin-top:8px }

/* ══ goals ══ */
.cut-card{ background:var(--red); color:var(--paper); border:3px solid var(--ink); padding:28px 32px;
  display:grid; grid-template-columns:380px minmax(0,1fr); gap:40px }
.cut-left{ display:flex; flex-direction:column }
.cut-num{ display:flex; align-items:baseline; gap:12px; margin-top:14px }
.cut-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:112px; line-height:0.8 }
.cut-target{ font-weight:800; font-size:15px }
.cut-pct{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:44px;
  line-height:1; margin-top:18px }
.cut-pct span{ font-family:'Archivo',sans-serif; font-weight:800; font-size:12px; letter-spacing:0.12em }
.cut-bar{ height:14px; background:rgba(26,22,16,0.28); margin-top:10px }
.cut-bar i{ display:block; height:100%; background:var(--paper); width:var(--pct);
  transform-origin:left; animation:barGrow .55s ease-out }
.cut-summary{ font-weight:700; font-size:13px; line-height:1.5; margin-top:auto; padding-top:18px }
.cut-right{ display:flex; flex-direction:column; min-width:0 }
.cut-chart-head{ display:flex; justify-content:space-between; gap:16px;
  font-weight:800; font-size:11px; letter-spacing:0.14em }
.cut-chart{ height:300px; margin-top:14px }
.pace-card{ border:3px solid var(--ink); background:var(--card); padding:24px 28px;
  display:grid; grid-template-columns:260px minmax(0,1fr); gap:32px }
.pace-left{ display:flex; flex-direction:column; gap:14px }
.pace-ahead{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:72px;
  line-height:0.85; color:var(--c) }
.pace-ahead-lbl{ font-weight:800; font-size:12px; letter-spacing:0.12em; margin-top:6px }
.pace-stat{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  border-top:2px solid var(--hairline); padding-top:8px }
.pace-stat span{ font-weight:800; font-size:11px; letter-spacing:0.12em; color:var(--muted) }
.pace-stat b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:24px }
.pace-legend{ display:flex; gap:24px; font-weight:800; font-size:11px; letter-spacing:0.12em; flex-wrap:wrap }
.pace-legend span{ display:flex; align-items:center; gap:8px }
.pace-legend i{ width:26px; flex:none }
.pace-svg{ width:100%; height:auto; display:block; overflow:visible; margin-top:12px }
.goal-tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.goal-tile{ border:3px solid var(--ink); padding:24px 26px; background:var(--c); color:var(--fg) }
.goal-tile-top{ display:flex; justify-content:space-between; align-items:center; gap:12px }
.goal-tile-pct{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:28px;
  line-height:1; color:var(--accent) }
.goal-tile-num{ display:flex; align-items:baseline; gap:12px; margin-top:10px }
.goal-tile-val{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:60px; line-height:0.8 }
.goal-tile-val.na{ font-family:'Archivo',sans-serif; font-weight:800; font-size:38px; opacity:0.6 }
.goal-tile-target{ font-weight:800; font-size:13px; letter-spacing:0.06em }
.goal-tile-bar{ height:10px; margin-top:18px; background:var(--track) }
.goal-tile-bar i{ display:block; height:100%; background:var(--accent); width:var(--w);
  transform-origin:left; animation:barGrow .55s ease-out }
.goal-tile-sub{ font-weight:600; font-size:13px; margin-top:10px }
.why-strip{ border:3px solid var(--ink); padding:22px 26px; display:flex; align-items:center;
  justify-content:space-between; gap:24px }
.why-strip-text{ font-family:'Newsreader',serif; font-style:italic; font-size:22px;
  line-height:1.4; margin-top:8px; color:var(--muted) }
.why-strip-text.set{ color:var(--ink) }

/* ══ notes ══ */
.note-filters{ display:flex; gap:8px; flex-wrap:wrap }
.note-filter{ border:2px solid var(--ink); border-radius:30px; padding:7px 14px;
  font-weight:800; font-size:11px; letter-spacing:0.12em; background:transparent; color:var(--ink) }
.note-filter.active{ background:var(--ink); color:var(--paper) }
.note-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px }
.note-card{ border:3px solid var(--ink); background:var(--card); padding:20px 24px;
  display:flex; flex-direction:column; gap:12px }
.note-top{ display:flex; align-items:center; gap:12px }
.note-cat{ font-weight:800; font-size:10px; letter-spacing:0.14em; padding:4px 8px;
  background:var(--c); color:var(--fg) }
.note-date{ font-weight:700; font-size:11px; letter-spacing:0.08em; color:var(--muted) }
.note-del{ margin-left:auto; width:28px; height:28px; border:2px solid var(--dash);
  border-radius:50%; font-weight:800; font-size:12px; color:var(--muted); flex-shrink:0 }
.note-body{ font-weight:500; font-size:16px; line-height:1.5; text-wrap:pretty; white-space:pre-wrap }
.empty{ font-weight:600; font-size:14px; color:var(--muted); padding:20px 0 }

/* ══ modals ══ */
.scrim{ position:absolute; inset:0; z-index:50; background:var(--scrim);
  display:flex; align-items:center; justify-content:center; padding:24px; animation:scrimIn .18s ease-out }
.modal{ width:600px; max-width:100%; max-height:92%; overflow-y:auto; background:var(--paper);
  border:3px solid var(--ink); box-shadow:10px 10px 0 var(--ink); animation:sheetIn .22s ease-out }
.modal.sm{ width:460px }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:22px 26px; border-bottom:3px solid var(--ink) }
.modal-head.spine{ border-top:10px solid var(--c) }
.modal-title{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:36px; line-height:0.85 }
.modal.sm .modal-title{ font-size:34px }
.modal-sub{ font-weight:800; font-size:11px; letter-spacing:0.14em; color:var(--muted); margin-top:6px }
.modal-x{ width:38px; height:38px; border:2px solid var(--ink); border-radius:50%;
  font-weight:800; font-size:15px; flex-shrink:0 }
.modal-body{ padding:24px 26px; display:flex; flex-direction:column; gap:14px }
.modal-foot{ display:flex; gap:10px; padding:0 26px 26px }
.modal-foot .g{ flex:1; padding:14px; border:2px solid var(--ink);
  font-weight:800; font-size:13px; letter-spacing:0.1em }
.modal-foot .p{ flex:2; padding:14px; background:var(--ink); color:var(--paper);
  border:2px solid var(--ink); font-weight:800; font-size:13px; letter-spacing:0.1em }
.modal-hint{ font-weight:600; font-size:13px; line-height:1.45; color:var(--muted); margin-top:14px }

.prog-card{ display:flex; align-items:stretch; text-align:left; border:3px solid var(--ink);
  background:var(--card); padding:0; width:100% }
.prog-spine{ width:12px; flex:none; background:var(--c) }
.prog-body{ flex:1; padding:16px 20px; display:flex; align-items:center;
  justify-content:space-between; gap:16px }
.prog-name{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:30px; line-height:0.85 }
.prog-meta{ font-weight:700; font-size:12px; letter-spacing:0.06em; color:var(--muted); margin-top:6px }
.prog-right{ display:flex; align-items:center; gap:12px }
.prog-next{ font-weight:800; font-size:10px; letter-spacing:0.14em; padding:4px 8px;
  background:var(--ink); color:var(--gold) }
.prog-arrow{ font-weight:800; font-size:18px }

.log-ex{ border:3px solid var(--ink); background:var(--card) }
.log-ex-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; border-bottom:2px solid var(--hairline) }
.log-ex-name{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:24px; line-height:0.9 }
.log-ex-pills{ display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end }
.pill-last{ font-weight:800; font-size:10px; letter-spacing:0.06em; border:2px solid var(--ink);
  border-radius:20px; padding:4px 10px; white-space:nowrap }
.pill-max{ font-weight:800; font-size:10px; letter-spacing:0.06em; background:var(--red);
  color:var(--paper); border:2px solid var(--red); border-radius:20px; padding:4px 10px; white-space:nowrap }
.log-prog{ display:flex; align-items:center; gap:10px; padding:12px 16px 0; flex-wrap:wrap }
.log-prog-tag{ font-weight:800; font-size:11px; letter-spacing:0.1em; padding:4px 9px;
  white-space:nowrap; background:transparent; color:var(--ink); border:2px solid var(--ink) }
.log-prog-tag.up{ background:var(--green); color:var(--paper); border-color:var(--green) }
.log-prog-why{ font-weight:600; font-size:12px; color:var(--muted) }
.log-sets{ padding:12px 16px 14px; display:grid; grid-template-columns:48px 96px 20px 80px;
  gap:8px 10px; align-items:center }
.log-sets .th{ font-weight:800; font-size:10px; letter-spacing:0.12em; color:var(--muted) }
.log-set-n{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:20px }
.log-in{ padding:6px 10px; background:var(--white); border:2px solid var(--ink);
  font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:20px;
  text-align:center; outline:none; width:100% }
.log-x{ font-weight:800; font-size:13px; color:var(--muted); text-align:center }
.log-note{ grid-column:1 / -1; margin-top:6px; padding:9px 12px; background:var(--white);
  border:2px dashed var(--dash); font-weight:500; font-size:13px; outline:none }
.log-sess-note{ background:var(--ink); color:var(--paper); padding:14px 16px }
.log-sess-note .lbl-s{ color:var(--gold) }
.log-sess-note input{ width:100%; margin-top:8px; padding:8px 0; background:transparent;
  border:none; border-bottom:2px solid var(--muted); color:var(--paper);
  font-weight:500; font-size:14px; outline:none }

.big-in-row{ display:flex; align-items:baseline; gap:12px }
.big-in{ padding:8px 14px; background:var(--white); border:3px solid var(--ink);
  font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:56px;
  line-height:1; outline:none; width:200px }
.big-in.wide{ width:220px }
.big-in-unit{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:32px; color:var(--muted) }
.sleep-btns{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px }
.sleep-btn{ padding:14px 0; border:2px solid var(--ink);
  font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:26px;
  background:transparent; color:var(--ink) }
.sleep-btn.near{ background:var(--card) }
.sleep-btn.on{ background:var(--ink); color:var(--paper) }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px }
.field-lbl{ font-weight:800; font-size:11px; letter-spacing:0.14em; color:var(--muted); margin-bottom:6px }
.mid-in{ width:100%; padding:8px 14px; background:var(--white); border:3px solid var(--ink);
  font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:40px; outline:none }
.text-in{ width:100%; padding:11px 14px; background:var(--white); border:2px solid var(--ink);
  font-weight:500; font-size:15px; outline:none }
.area-in{ width:100%; min-height:120px; padding:12px 14px; background:var(--white);
  border:2px solid var(--ink); font-weight:500; font-size:15px; line-height:1.5;
  outline:none; resize:vertical }
.sel-in{ width:100%; padding:11px 14px; background:var(--white); border:2px solid var(--ink);
  font-weight:800; font-size:12px; letter-spacing:0.12em; outline:none }
.imp-list{ display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto }
.imp-row{ padding:12px 16px; background:var(--white); border:2px solid var(--hairline) }
.imp-row-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:4px }
.imp-row-top b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:18px }
.imp-row-top span{ font-weight:700; font-size:11px; color:var(--muted) }
.imp-row-ex{ font-weight:500; font-size:12px; color:var(--muted) }

/* ══ PR moment ══ */
.pr-overlay{ position:absolute; inset:0; z-index:60; background:var(--red); color:var(--paper);
  display:flex; flex-direction:column; padding:48px 64px; animation:scrimIn .2s ease-out }
.pr-top{ display:flex; justify-content:space-between; align-items:center; gap:16px;
  font-weight:800; font-size:14px; letter-spacing:0.2em }
.pr-x{ width:44px; height:44px; border:3px solid var(--paper); border-radius:50%;
  font-weight:800; font-size:16px; color:var(--paper); flex-shrink:0 }
.pr-mid{ margin:auto 0; display:flex; flex-direction:column; gap:14px; min-width:0 }
.pr-ex{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:64px; line-height:0.9 }
.pr-num{ display:flex; align-items:flex-end; gap:28px; margin-top:18px }
.pr-kg{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:380px; line-height:0.76 }
.pr-unit{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:84px;
  line-height:0.9; padding-bottom:10px }
.pr-chips{ display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  font-weight:800; font-size:16px; letter-spacing:0.12em; margin-top:10px }
.pr-chips i{ font-style:normal; background:var(--ink); padding:6px 12px }
.pr-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:var(--ink); padding:18px 24px; flex-wrap:wrap }
.pr-bar>span{ font-weight:800; font-size:13px; letter-spacing:0.12em }
.pr-bar-btns{ display:flex; gap:10px }
.pr-ghost{ border:2px solid var(--paper); color:var(--paper); font-weight:800; font-size:13px;
  letter-spacing:0.1em; padding:12px 18px }
.pr-done{ background:var(--paper); color:var(--ink); border:2px solid var(--paper);
  font-weight:800; font-size:13px; letter-spacing:0.1em; padding:12px 22px }

/* ══ exercise drawer ══ */
.drawer-scrim{ position:absolute; inset:0; z-index:50; background:var(--scrim); animation:scrimIn .18s ease-out }
.drawer{ position:absolute; top:0; right:0; bottom:0; z-index:51; width:480px; max-width:100%;
  background:var(--paper); border-left:3px solid var(--ink); overflow-y:auto;
  animation:drawerIn .24s ease-out }
.drawer-head{ background:var(--ink); color:var(--paper); padding:24px 26px }
.drawer-head-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px }
.drawer-name{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:44px;
  line-height:0.85; margin-top:6px }
.drawer-x{ width:38px; height:38px; border:2px solid var(--paper); border-radius:50%;
  font-weight:800; font-size:15px; color:var(--paper); flex-shrink:0 }
.drawer-pills{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap }
.drawer-pill{ display:inline-flex; align-items:baseline; gap:8px; border-radius:30px; padding:7px 14px;
  background:var(--red) }
.drawer-pill.out{ border:2px solid var(--paper); padding:5px 14px; background:transparent }
.drawer-pill span{ font-weight:800; font-size:11px; letter-spacing:0.1em }
.drawer-pill b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:22px; line-height:0.8 }
.drawer-body{ padding:24px 26px }
.drawer-hist{ border:3px solid var(--ink); background:var(--card); margin-top:12px }
.drawer-hist-row{ display:grid; grid-template-columns:110px 80px 1fr; align-items:baseline;
  gap:10px; padding:12px 16px; border-bottom:2px solid var(--hairline) }
.drawer-hist-row:last-child{ border-bottom:none }
.drawer-hist-row span{ font-weight:700; font-size:12px; letter-spacing:0.06em; color:var(--muted) }
.drawer-hist-row b{ font-family:'Big Shoulders Display',sans-serif; font-weight:900;
  font-size:24px; line-height:0.85; color:var(--ink) }
.drawer-hist-row em{ font-style:normal; font-weight:700; font-size:13px; color:var(--muted) }
.drawer-notes{ display:flex; flex-direction:column; gap:10px; margin-top:12px }
.drawer-note{ background:var(--white); border:2px solid var(--hairline);
  border-left:4px solid var(--gold); padding:13px 16px }
.drawer-note-date{ font-weight:800; font-size:11px; letter-spacing:0.1em; color:var(--muted) }
.drawer-note-text{ font-weight:500; font-size:14px; line-height:1.5; margin-top:5px; white-space:pre-wrap }

/* ══ mobile bottom nav ══ */
.bottom-nav{ display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--paper); border-top:3px solid var(--ink) }
.bottom-nav-inner{ display:grid; grid-template-columns:repeat(4,1fr) }
.bottom-tab{ padding:14px 0; font-weight:800; font-size:10px; letter-spacing:0.12em;
  color:var(--muted); border-right:2px solid var(--hairline) }
.bottom-tab:last-child{ border-right:none }
.bottom-tab.active{ background:var(--ink); color:var(--paper) }

/* ══ mobile ══ */
@media (max-width: 768px){
  html,body{ overflow:auto }
  .app{ height:auto; min-height:100vh }
  /* The header stacks: the meta row cannot shrink below its chips, so it gets its
     own full-width row instead of a column it would overflow. */
  .hdr{ grid-template-columns:1fr }
  .hdr-logo{ padding:12px 16px; border-right:none; border-bottom:2px solid var(--hairline) }
  .wordmark{ font-size:28px }
  .hdr-nav{ display:none }
  .hdr-right{ padding:10px 16px; gap:8px; flex-wrap:wrap; justify-content:flex-start; min-width:0 }
  .hdr-right>*{ min-width:0 }
  .sync-chips{ flex-wrap:wrap }
  .chip-sync{ font-size:10px; padding:4px 7px }
  .ready-pill{ padding:5px 10px }
  .hdr-date{ font-size:11px }
  .banner{ padding:12px 16px; flex-wrap:wrap }

  .view{ padding-bottom:96px !important }
  #view-today{ padding:16px 16px 96px }
  #view-training,#view-goals,#view-notes{ padding:24px 16px 96px }
  #view-training{ gap:28px }
  .bottom-nav{ display:block }
  .embed .view{ padding-bottom:24px !important }

  .page-title{ font-size:38px }
  .page-head{ flex-direction:column; align-items:stretch; gap:14px }
  .head-btns{ flex-wrap:wrap }
  .head-btns button{ flex:1 }

  .today-row1{ grid-template-columns:1fr; min-height:0 }
  .hero,.evening{ padding:18px 20px 20px }
  .hero-kg,.evening-big{ font-size:104px }
  .hero-kg-unit,.evening-unit{ font-size:26px }
  .hero-stat-val{ font-size:32px }
  .hero-top,.evening-top{ flex-direction:column; align-items:flex-start; gap:8px }
  .hero-top-r{ width:100%; justify-content:space-between }
  .hero-foot,.evening-foot{ flex-direction:column; align-items:stretch }
  .hero-foot-l{ flex-direction:column; align-items:flex-start; gap:8px; width:100% }
  .hero-btn,.evening-btn{ width:100% }
  /* Milestone labels cannot sit side by side at this width: the ticks stay, the
     captions go, and START and FINISH keep the scale readable. */
  .hero-mark{ display:none }
  .hero-scale{ height:16px }
  .score-val{ font-size:68px }
  .recap-val{ font-size:40px }
  .why-text{ font-size:22px }
  .pillars{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .pillar{ min-height:190px }
  .pillar-val{ font-size:46px }

  .week{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
  .sess-head{ gap:8px }
  .sess-meta{ margin-left:0; width:100% }
  .sess-table{ grid-template-columns:minmax(0,1fr) 64px 92px }
  .sess-reps{ font-size:12px }
  .grid-card{ flex-direction:column; gap:20px; padding:16px }
  .grid-legend{ margin-left:0; min-width:0; width:100% }
  .lifts{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .stat-strip{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .stat-cell{ border-right:3px solid var(--ink); border-bottom:3px solid var(--ink) }
  .stat-cell:nth-child(2n){ border-right:none }
  .stat-cell:nth-last-child(-n+2){ border-bottom:none }
  .run-cards{ grid-template-columns:repeat(2,minmax(0,1fr)) }

  .cut-card{ grid-template-columns:1fr; gap:24px; padding:20px }
  .cut-val{ font-size:72px }
  .cut-chart{ height:220px }
  .pace-card{ grid-template-columns:1fr; gap:20px; padding:18px 20px }
  .pace-ahead{ font-size:56px }
  .goal-tiles{ grid-template-columns:1fr }
  .why-strip{ flex-direction:column; align-items:stretch }
  .why-strip button{ width:100% }
  .note-grid{ grid-template-columns:1fr }

  .scrim{ align-items:flex-end; padding:0 }
  .modal,.modal.sm{ width:100%; max-height:94vh; border-left:none; border-right:none;
    border-bottom:none; box-shadow:none }
  .modal-foot{ padding-bottom:32px }

<script src="weight-units.js"></script>
<script src="hub-origin.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════════════════

// One colour per program type. Nothing else may use these.
// PT takes the purple that UPPER had; Chris's PUSH/PULL/LEGS stay only so any
// imported history still colours correctly.
const TYPE_COLOR = { PUSH:'#f4a800', PULL:'#2e44c8', LEGS:'var(--green)', PT:'var(--purple)' }
const INK = '#1a1610', PAPER = '#efe9da', CARD = '#f7f1e3', MUTED = '#6b6555'
const RED = 'var(--red)', GOLD = '#f4a800', BLUE = '#2e44c8', GREEN = 'var(--green)', AMBER = '#b87d00'

// Text on gold is ink; text on every other fill is paper.
const typeColor = t => TYPE_COLOR[t] || MUTED
const typeFg = t => t === 'PUSH' ? INK : PAPER

// Robert trains with an Equinox coach, who picks the exercises on the day, so the
// one program has no fixed list. `coach` marks that: the logger asks for a session
// note instead of prefilled sets.
const PROGRAMS = [
  { id:'pt', short:'PT', name:'PT · TYE', coach:'Tye Castle', place:'Equinox', time:'8 AM', exercises:[] },
]

// Day of week → planned session type (0=Sun … 6=Sat), null being a rest/steps day.
// Edit this and PROGRAMS above to match your own split. Nothing is planned before
// ROUTINE_START, so days before the schedule began never show as missed.
const ROUTINE = { 0:null, 1:'PT', 2:null, 3:null, 4:'PT', 5:null, 6:null }
const ROUTINE_START = '2026-10-05'
const LIFT_TYPES = ['PT', 'PUSH', 'PULL', 'LEGS', 'UPPER']
const PER_WEEK = Object.values(ROUTINE).filter(Boolean).length
const plannedOn = iso => iso >= ROUTINE_START ? ROUTINE[asDate(iso).getDay()] : null
const programOf = t => PROGRAMS.find(p => p.short === t) || null

const ETA_MAX_DAYS = 550                  // past ~18 months a projection is not a plan
// These three carry a sensible default and are overridden by the profile on load.
let STEP_TARGET = 10000                   // goals.step_target
let SLEEP_TARGET = 7                      // goals.sleep_target
let PLAN_KG_PER_WEEK = 1.0                // goals.plan_kg_per_week
const WALK_PACE_SEC_PER_KM = 540          // slower than 9:00/km is a walk, not a run

// Height and birth date size the calorie budget. They live in the profile, so an
// unset profile makes the budget say so rather than guess someone's body.
const bodyMetrics = () => ({ heightCm: +goals.height_cm || 0, birth: goals.birth_date || '' })

// The cut's first day: the profile value, else the earliest weigh-in, else today.
function cutStartDate() {
  if (goals.cut_start) return goals.cut_start
  const h = [...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
  return h.length ? h[0].date : localIso()
}

// Round-number marks on the hero scale, derived from the range being cut. Names come
// from goals.milestone_labels, a {"105":"RUNNING BACK"} JSON blob, when it has one.
function milestones(start, goal) {
  let names = {}
  try { names = JSON.parse(goals.milestone_labels || '{}') } catch { names = {} }
  const step = start - goal > 25 ? 10 : 5
  const out = []
  for (let kg = Math.floor((start - 0.5) / step) * step; kg > goal + 0.5; kg -= step)
    out.push([kg, names[kg] || `${kg} KG`])
  return out
}
const EVENING_HOUR = 18
const BUMP_KG = 0.5                       // a weigh-in up this much shows the why card
const CAT_COLOR = {
  nutrition:[GREEN, PAPER], recovery:[BLUE, PAPER], training:[GOLD, INK],
  mindset:[RED, PAPER], habits:[INK, PAPER], body:[RED, PAPER], general:[MUTED, PAPER],
}
const CAT_ORDER = ['body', 'nutrition', 'recovery', 'training', 'mindset', 'habits', 'general']
const catOf = n => n.category || 'general'
// Categories are whatever the notes actually carry, in a fixed order where known.
function noteCats() {
  const found = [...new Set(notesData.map(catOf))]
  return found.sort((a,b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b)
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b)
  })
}
const TABS = ['today', 'training', 'goals', 'notes']

// Served at the root of its own host, so BASE is empty and /api and /auth are unchanged.
// If the page is opened under /fitlog/, those calls keep that prefix.
const BASE = (location.pathname.match(/^\/fitlog(?=\/|$)/) || [''])[0]
const withBase = u => u.startsWith('/') ? BASE + u : u
// ?embed=1 hides FITLOG's own chrome; the host drives tabs through the hash (#goals).
const EMBED = new URLSearchParams(location.search).get('embed') === '1'
document.documentElement.classList.toggle('embed', EMBED)
// Framed by the hub. Messages go to HUB_ORIGIN only, never '*' and never this origin.
const IN_FRAME = EMBED && window.parent !== window
let HUB_ORIGIN = null
function parentTarget() {
  return HubOrigin.messageTarget(HUB_ORIGIN, location.origin)
}
function postHeight() {
  const target = parentTarget()
  if (!IN_FRAME || !target) return
  const app = document.querySelector('.app')
  const height = Math.ceil(Math.max(app.offsetHeight, app.scrollHeight))
  window.parent.postMessage({ type:'fitlog:height', height }, target)
}
function watchEmbedHeight() {
  if (!EMBED) return
  new ResizeObserver(() => postHeight()).observe(document.body)
  window.addEventListener('resize', postHeight)
}
async function loadHubOrigin() {
  if (!EMBED) return
  const cfg = await api('GET', '/api/config')
  HUB_ORIGIN = cfg && typeof cfg.hubOrigin === 'string' ? cfg.hubOrigin : null
}
// Embed hides SLEEP and STEPS while Fitbit is down; today's score counts the other two.
const fbHidden = () => EMBED && syncFitbit.ok === false

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════
let todayData = {}, sessions = [], runs = [], prs = {}, yearPrs = {}, goals = {}
let liftHistory = [], stepsData = [], dietData = [], sleepData = [], habitsData = []
let recoveryData = [], notesData = []
let syncFitbit = {}, syncWithings = {}
let tab = 'today', noteCat = 'all', sleepPick = SLEEP_TARGET
let draftProgram = null, draftLog = [], draftNote = ''
let importParsed = []
const YEAR = new Date().getFullYear()
const YEAR_START = `${YEAR}-01-01`

// ══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════════════
async function api(method, url, body) {
  try {
    const r = await fetch(withBase(url), {
      method,
      headers: body ? { 'Content-Type':'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    })
    return r.ok ? r.json() : null
  } catch (e) { return null }
}

// Escapes quotes too, so a name with an apostrophe is safe inside an attribute.
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

// One date helper. toISOString() gives the UTC day, which is the previous day
// before 04:00, so nothing in this file may use it.
function localIso(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function addDays(iso, n) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return localIso(d)
}
const asDate = iso => new Date(iso + 'T12:00:00')
const daysBetween = (a, b) => Math.round((asDate(b) - asDate(a)) / 86400000)

function fmtKg(v) { if (v == null) return '—'; const n = parseFloat(v); return n === Math.floor(n) ? String(Math.floor(n)) : n.toFixed(1) }
const LB_PER_KG = WeightUnits.LB_PER_KG
function fmtLb(kg) { return WeightUnits.lbFromKg(kg) }
// Embed only: a small line under a kilogram figure. Standalone gets an empty string.
function lbHTML(kg, suffix = 'LB') {
  if (!EMBED) return ''
  const lb = fmtLb(kg)
  return lb == null ? '' : `<span class="lb">${lb} ${suffix}</span>`
}
// Month and day names are spelled out here rather than left to the locale, which
// renders September as SEPT and breaks the fixed-width datelines.
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']
const WEEKDAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT']
function fmtDateObj(d) { return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` }
function fmtDate(iso) { return fmtDateObj(asDate(iso)) }
function fmtDayMonObj(d) {
  const y = d.getFullYear()
  return `${d.getDate()} ${MONTHS[d.getMonth()]}${y === new Date().getFullYear() ? '' : ` ${y}`}`
}
function fmtDayMon(iso) { return fmtDayMonObj(asDate(iso)) }
function fmtDayMonMs(ms) { return fmtDayMonObj(new Date(ms)) }
function fmtDur(sec) { if (!sec) return '—'; return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}` }
function fmtPace(km, sec) { if (!km || !sec) return null; const s = sec/km; return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')} / KM` }
function fmtTime(t) {
  if (!t) return null
  const d = new Date(String(t).includes('T') ? t : String(t).replace(' ', 'T') + 'Z')
  return isNaN(d) ? null : d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
}
function weekNum(d = new Date()) {
  const jan1 = new Date(d.getFullYear(), 0, 1)
  return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7)
}
const mean = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null
const num = n => Number(n).toLocaleString('en-GB')
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
const clampPct = v => Math.max(0, Math.min(100, v))
const sgn = v => `${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}`

// Sessions carry the program in `name` for imports and in `type` for logged ones.
function typeOf(s) {
  const t = String(s.name || s.type || '').toUpperCase()
  if (t.includes('PUSH')) return 'PUSH'
  if (t.includes('PULL')) return 'PULL'
  if (t.includes('LEG')) return 'LEGS'
  if (t.includes('UPPER')) return 'UPPER'
  if (/^PT\b|PERSONAL TRAIN/.test(t)) return 'PT'
  if (t.includes('CARDIO')) return 'CARDIO'
  if (t.includes('RUN')) return 'CARDIO'
  return t.split(/[·\s]/)[0] || 'SESSION'
}

const isLift = s => LIFT_TYPES.includes(typeOf(s))

// One scoring function for the day: sleep, food, steps, workout.
// fbOff drops the two Fitbit pillars (embed mode while Fitbit is disconnected).
function dayScore(h, fbOff = false) {
  if (!h) return 0
  return (!fbOff && h.sleep_h > 0 ? 1 : 0) + (h.diet_ok ? 1 : 0)
    + (!fbOff && h.steps >= STEP_TARGET ? 1 : 0) + (h.workout ? 1 : 0)
}
function habitMap() {
  const m = {}; habitsData.forEach(h => { m[h.date] = h }); return m
}
// Full 4/4 days before today. Today stays out so a day in progress never breaks it.
function fullDayStreak() {
  const m = habitMap(), t = localIso()
  let n = 0
  for (let i = 1; i < 366; i++) { if (dayScore(m[addDays(t, -i)]) === 4) n++; else break }
  return n
}

const isWalk = r => (r.kind ? r.kind === 'walk'
  : !!(r.duration_sec && r.distance_km && r.duration_sec / r.distance_km > WALK_PACE_SEC_PER_KM))
const realRuns = () => runs.filter(r => !isWalk(r))
const is5k = r => r.distance_km >= 4.8 && r.distance_km <= 5.2 && r.duration_sec
const fastest5k = list => list.filter(is5k).reduce((a, r) => (!a || r.duration_sec < a.duration_sec) ? r : a, null)

// The next planned session from today on that isn't logged yet, read off ROUTINE.
function nextPlanned() {
  const today = localIso()
  const logged = new Set(sessions.map(s => s.date))
  for (let i = 0; i < 21; i++) {
    const iso = addDays(today, i)
    const t = plannedOn(iso)
    if (t && !logged.has(iso)) return { type:t, date:iso, today: i === 0 }
  }
  return null
}
function nextRotationType() { return (nextPlanned() || {}).type || PROGRAMS[0].short }
// "PT MON 5 OCT · 8 AM", or "PT TODAY · 8 AM".
function nextPlannedTxt() {
  const n = nextPlanned()
  if (!n) return 'NOTHING PLANNED'
  const p = programOf(n.type)
  return `${n.type} ${n.today ? 'TODAY' : fmtDate(n.date)}${p && p.time ? ` · ${p.time}` : ''}`
}
function lastSessionOfType(t) {
  return sessions.filter(s => typeOf(s) === t).sort((a,b) => a.date < b.date ? 1 : -1)[0] || null
}
// Session numbers count up from the first session of the cut, matching the Notes log.
function sessionNumbers() {
  const start = cutStartDate()
  const era = sessions.filter(s => s.date >= start).slice()
    .sort((a,b) => a.date === b.date ? a.id - b.id : (a.date < b.date ? -1 : 1))
  const map = {}
  era.forEach((s, i) => { map[s.id] = i + 1 })
  return map
}
// Bodyweight on or before a date.
function bwOn(iso) {
  let v = null
  ;[...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
    .forEach(x => { if (x.date <= iso) v = x.weight_kg })
  return v
}

// ══════════════════════════════════════════════════════════════════════════════
// DERIVED MODEL
// ══════════════════════════════════════════════════════════════════════════════

// One velocity, one projection: the last 14 days of weigh-ins.
function velocity() {
  const h = [...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
  if (h.length < 2) return null
  const newest = h[h.length-1]
  const cutoff = addDays(newest.date, -14)
  const win = h.filter(b => b.date >= cutoff)
  const oldest = win.length >= 2 ? win[0] : h[h.length-2]
  const days = daysBetween(oldest.date, newest.date)
  if (days < 1) return null
  return { weekly: (newest.weight_kg - oldest.weight_kg) / days * 7, days, newest, oldest }
}

// The one projection: today's weight, the 14-day rate, and a horizon past which the
// pace says nothing useful. Everything that shows an ETA reads this.
function projection() {
  const bw = todayData.bodyWeight
  const goal = goals.bw_goal
  const vel = velocity()
  const weekly = vel ? vel.weekly : null
  if (!bw || !goal || weekly == null || weekly >= -0.05) return { weekly, etaMs:null, days:null }
  const days = (bw.weight_kg - goal) / Math.abs(weekly) * 7
  if (!(days > 0) || days > ETA_MAX_DAYS) return { weekly, etaMs:null, days }
  return { weekly, days, etaMs: asDate(localIso()).getTime() + days * 86400000 }
}

// On track: losing at least ~90% of the planned rate, or already within 1 kg of the
// goal and not gaining. One verdict for the hero, the evening card and the cut card.
const PACE_TOLERANCE = 0.9
const NEAR_GOAL_KG = 1
function paceVerdict(weekly, w = (todayData.bodyWeight || {}).weight_kg) {
  if (weekly == null) return 'NO TREND YET'
  const toGo = goals.bw_goal && w ? w - goals.bw_goal : null
  if (toGo != null && toGo <= 0) return 'AT GOAL'
  if (weekly <= -PLAN_KG_PER_WEEK * PACE_TOLERANCE) return 'ON TRACK'
  if (toGo != null && toGo <= NEAR_GOAL_KG && weekly < 0.05) return 'ON TRACK'
  return 'BELOW TARGET'
}

// Energy budget: Mifflin St Jeor BMR, a sedentary multiplier, plus the real cost of
// the day's steps. 1 kg of fat is 7700 kcal, so 1 kg/week is a 1100 kcal daily deficit
// and 0.5 kg/week is 550.
const KCAL_PER_KG_FAT = 7700
const KCAL_PER_1K_STEPS = 43
const SEDENTARY = 1.15
const STEPS_PER_KM = 1333
const HR_SHADE = 0.8            // Keytel runs high at walking intensity
const HR_BONUS_CAP = 250
function kcalFromHR(hr, minutes, kg, age) {
  if (!hr || !minutes) return 0
  const perMin = (-55.0969 + 0.6309*hr + 0.1988*kg + 0.2017*age) / 4.184
  return Math.max(0, perMin * minutes) * HR_SHADE
}
function energy() {
  const bw = todayData.bodyWeight
  const today = localIso()
  const steps = (stepsData.find(s => s.date === today) || {}).steps || 0
  const eaten = todayData.todayKcal || 0
  const me = bodyMetrics()
  const needsProfile = !me.heightCm || !me.birth
  if (!bw || needsProfile) return { eatToday:0, walkWorth:0, eaten, left:0, steps, over:false, ok:false, needsProfile }
  const age = Math.floor((Date.now() - new Date(me.birth)) / 31557600000)
  const bmr = 10*bw.weight_kg + 6.25*me.heightCm - 5*age + 5
  const hrBonus = Math.min(HR_BONUS_CAP, runs.filter(r => r.date === today && r.avg_hr && r.duration_sec)
    .reduce((sum, r) => {
      const byHR = kcalFromHR(r.avg_hr, r.duration_sec/60, bw.weight_kg, age)
      const counted = (r.distance_km || 0) * STEPS_PER_KM / 1000 * KCAL_PER_1K_STEPS
      return sum + Math.max(0, byHR - counted)
    }, 0))
  const burn = s => bmr*SEDENTARY + (s/1000)*KCAL_PER_1K_STEPS + hrBonus
  // The deficit follows the profile's planned rate (goals.plan_kg_per_week), 1 kg/week if unset.
  const rate = +goals.plan_kg_per_week || 1
  const deficit = KCAL_PER_KG_FAT * rate / 7
  const FLOOR = 1600
  const eatToday = Math.max(FLOOR, Math.round(burn(steps) - deficit))
  const eatAtTarget = Math.max(FLOOR, Math.round(burn(STEP_TARGET) - deficit))
  const left = eatToday - eaten
  return { eatToday, eatAtTarget, walkWorth: Math.max(0, eatAtTarget - eatToday), eaten, left, steps, over: left < 0, ok:true }
}

// Readiness: unchanged rules. RHR against a 7-day baseline, HRV against 75% of it,
// and last night's sleep.
function readiness() {
  const sl = todayData.todaySleepHours || 0
  const rec = [...recoveryData].filter(r => r.rhr || r.hrv_ms).sort((a,b) => a.date < b.date ? -1 : 1)
  let verdict = 'GREEN', color = GREEN, short = 'TRAIN', advice = 'Train as planned. Push targets.'
  let stats = [], rhrUp = 0, asOf = null
  if (rec.length) {
    const latest = rec[rec.length-1], prior = rec.slice(-8, -1)
    const rhrBase = mean(prior.map(r => r.rhr).filter(Boolean))
    const hrvBase = mean(prior.map(r => r.hrv_ms).filter(Boolean))
    rhrUp = latest.rhr && rhrBase ? latest.rhr - rhrBase : 0
    const hrvLow = latest.hrv_ms && hrvBase ? latest.hrv_ms < hrvBase*0.75 : false
    if (rhrUp >= 5 || (sl > 0 && sl < 5.5)) { verdict='RED'; color=RED; short='REST'; advice='Walk and mobility only. Protect the back.' }
    else if (rhrUp >= 3 || hrvLow || (sl > 0 && sl < SLEEP_TARGET)) { verdict='AMBER'; color=AMBER; short='HOLD'; advice='Train, hold weights. No new PRs.' }
    if (latest.rhr) stats.push({ lbl:'RESTING HR', val: Math.round(latest.rhr), delta: rhrBase ? `${sgn(latest.rhr-rhrBase)} vs 7d` : '' })
    if (latest.hrv_ms) stats.push({ lbl:'HRV', val: Math.round(latest.hrv_ms), delta: hrvBase ? `${sgn(latest.hrv_ms-hrvBase)} vs 7d` : '' })
    asOf = latest.date
  } else {
    if (sl > 0 && sl < 5.5) { verdict='RED'; color=RED; short='REST'; advice='Walk and mobility only. Protect the back.' }
    else if (sl > 0 && sl < SLEEP_TARGET) { verdict='AMBER'; color=AMBER; short='HOLD'; advice='Train, hold weights. No new PRs.' }
  }
  if (sl > 0) stats.push({ lbl:'SLEEP', val: sl.toFixed(1), delta:'HRS' })
  return { verdict, color, short, advice, stats: stats.slice(0, 3), rhrUp, asOf }
}

// Mode comes from the clock and the data, never from a user setting.
function deriveMode() {
  const today = localIso()
  const hour = new Date().getHours()
  const hist = [...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
  const weighedToday = hist.some(b => b.date === today)
  const score = dayScore(habitMap()[today], fbHidden())
  const ready = readiness()
  const bump = hist.length >= 2
    && hist[hist.length-1].weight_kg - hist[hist.length-2].weight_kg >= BUMP_KG
  return {
    notWeighed: !weighedToday,
    evening: hour >= EVENING_HOUR && score === 3,
    monday: new Date().getDay() === 1,
    red: ready.verdict === 'RED',
    bump,
    score, max: fbHidden() ? 2 : 4, hour, ready, today,
  }
}

// Ten years of weigh-ins, 7-day averaged, with the 1 kg/week projection to goal.
// Domains come from the data: y from the series (±2 kg, goal always inside), and the
// right edge from whichever comes later, a month from today or a month past the ETA.
function heroChartSVG(data, goalKg, opts = {}) {
  if (!data || data.length < 2) return ''
  const L = opts.label || 1
  const ink = opts.ink || '239,233,218'
  const accent = opts.accent || '244,168,0'
  const goal = goalKg || Math.min(...data.map(d => d.weight_kg))
  const W = opts.W || 620, H = opts.H || 230
  const pl = 6, pr = 76*L, pt = 16, pb = 30*L
  const iw = W - pl - pr, ih = H - pt - pb

  const kgs = data.map(d => d.weight_kg)
  const yMin = Math.min(Math.min(...kgs), goal) - 2
  const yMax = Math.max(...kgs) + 2
  const py = v => pt + ((yMax - v) / (yMax - yMin)) * ih

  const smoothed = data.map((d, i) => {
    const lo = Math.max(0, i-3), hi = Math.min(data.length, i+4)
    return { date: d.date, weight_kg: data.slice(lo, hi).reduce((s,x) => s + x.weight_kg, 0) / (hi-lo) }
  })
  const lastPt = data[data.length-1]
  const lastSm = smoothed[smoothed.length-1].weight_kg
  const lastMs = asDate(lastPt.date).getTime()
  const daysToGoal = Math.max(0, (lastSm - goal) * 7)      // at 1 kg/week
  const crossMs = lastMs + daysToGoal*86400000

  const t0 = asDate(data[0].date).getTime()
  const todayMs = asDate(localIso()).getTime()
  const tEnd = Math.max(todayMs + 30*86400000, (daysToGoal > 0 ? crossMs : todayMs) + 30*86400000)
  const tSpan = tEnd - t0
  const dx = iso => pl + ((asDate(iso).getTime() - t0) / tSpan) * iw
  const dxMs = ms => pl + ((ms - t0) / tSpan) * iw
  const todayX = dxMs(todayMs), rightX = pl + iw

  // Break the line at real gaps rather than drawing across dead years.
  const segs = []; let seg = [smoothed[0]]
  for (let i = 1; i < smoothed.length; i++) {
    if (asDate(smoothed[i].date) - asDate(smoothed[i-1].date) > 90*86400000) { segs.push(seg); seg = [] }
    seg.push(smoothed[i])
  }
  segs.push(seg)
  const pts = s => s.map(d => `${dx(d.date).toFixed(1)},${py(d.weight_kg).toFixed(1)}`).join(' L')
  const paths = segs.filter(s => s.length > 1)
    .map(s => `<path d="M${pts(s)}" fill="none" stroke="rgba(${ink},0.85)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`).join('')
  const last = segs[segs.length-1]
  const area = last.length > 1
    ? `<path d="M${pts(last)} L${todayX.toFixed(1)},${(pt+ih).toFixed(1)} L${dx(last[0].date).toFixed(1)},${(pt+ih).toFixed(1)} Z" fill="rgba(${ink},0.07)"/>`
    : ''

  const gy = py(goal)
  const inWin = daysToGoal > 0 && dxMs(crossMs) <= rightX
  const endX = inWin ? dxMs(crossMs) : rightX
  const endY = inWin ? gy : py(lastSm - ((tEnd - lastMs)/86400000)/7)
  const txt = (x, y, size, fill, s, anchor = 'start', ls = 1) => {
    const px = EMBED ? Math.max(12, size * L) : size * L
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="Archivo,sans-serif" font-weight="800" font-size="${px.toFixed(1)}" letter-spacing="${ls}" text-anchor="${anchor}" fill="${fill}">${s}</text>`
  }

  let out = ''
  out += `<line x1="${pl}" y1="${gy.toFixed(1)}" x2="${rightX}" y2="${gy.toFixed(1)}" stroke="rgba(${accent},0.5)" stroke-width="1.5" stroke-dasharray="6 4"/>`
  out += `<rect x="${todayX.toFixed(1)}" y="${pt}" width="${Math.max(0, rightX-todayX).toFixed(1)}" height="${ih}" fill="rgba(0,0,0,0.1)"/>`
  out += area
  out += `<line x1="${todayX.toFixed(1)}" y1="${pt}" x2="${todayX.toFixed(1)}" y2="${(pt+ih).toFixed(1)}" stroke="rgba(${ink},0.25)" stroke-width="1"/>`
  out += paths
  if (daysToGoal > 0) out += `<path d="M${dx(lastPt.date).toFixed(1)},${py(lastSm).toFixed(1)} L${endX.toFixed(1)},${endY.toFixed(1)}" fill="none" stroke="rgba(${accent},0.55)" stroke-width="2.5" stroke-dasharray="7 5"/>`
  out += `<circle cx="${dx(lastPt.date).toFixed(1)}" cy="${py(lastSm).toFixed(1)}" r="5.5" fill="rgb(${ink})"/>`
  if (inWin) {
    out += `<circle cx="${endX.toFixed(1)}" cy="${gy.toFixed(1)}" r="4" fill="rgba(${accent},0.9)"/>`
    if (rightX - endX > 60*L) out += txt(endX + 7, gy + 4, 10, `rgba(${accent},0.9)`, fmtDayMonMs(crossMs))
  }

  const y0 = new Date(t0).getFullYear() + 1, y1 = new Date(tEnd).getFullYear()
  for (let yr = y0; yr <= y1; yr++) {
    const x = dx(`${yr}-01-01`)
    if (x < pl || x > rightX) continue
    out += `<line x1="${x.toFixed(1)}" y1="${(pt+ih+1).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(pt+ih+6).toFixed(1)}" stroke="rgba(${ink},0.3)" stroke-width="1"/>`
    out += txt(x, pt + ih + 15*L, 10, `rgba(${ink},0.6)`, `'${String(yr).slice(2)}`, 'middle', 0)
  }
  out += txt(rightX + 6, gy + 4, 10, `rgba(${accent},0.9)`, `${goal} GOAL`)
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">${out}</svg>`
}

function sparkLine(vals, w = 200, h = 40) {
  if (!vals || vals.length < 2) return ''
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1
  return vals.map((v, i) => `${(i/(vals.length-1)*w).toFixed(1)},${(h - 4 - ((v-mn)/rng)*(h-8)).toFixed(1)}`).join(' ')
}

function syncChip(name, status, timeSrc, waitingLabel) {
  const cls = !status.connected || status.ok === false ? 'expired'
    : (timeSrc ? '' : 'waiting')
  if (cls === 'expired') {
    const url = withBase(status.reconnect_url || '#')
    const why = status.last_error ? `Sync failed: ${status.last_error}`
      : status.stale_hours != null ? `Last sync ${status.stale_hours}h ago`
      : 'Not connected'
    return `<a class="chip-sync expired" href="${esc(url)}" title="${esc(why)}. Reconnect.">${name} · RECONNECT</a>`
  }
  if (cls === 'waiting') return `<span class="chip-sync waiting" title="${esc(waitingLabel)}">${name} · WAITING</span>`
  return `<span class="chip-sync" title="Last sync ${esc(timeSrc)}">${name} ${esc(timeSrc)}</span>`
}

function renderHeader(mode) {
  document.getElementById('hdr-nav').innerHTML = TABS.map(t =>
    `<button class="tab${t === tab ? ' active' : ''}" data-act="tab" data-tab="${t}">${t.toUpperCase()}</button>`).join('')
  document.querySelector('#bottom-nav .bottom-nav-inner').innerHTML = TABS.map(t =>
    `<button class="bottom-tab${t === tab ? ' active' : ''}" data-act="tab" data-tab="${t}">${t.toUpperCase()}</button>`).join('')

  const today = localIso()
  const fbTime = syncFitbit.last_sync && syncFitbit.last_sync.slice(0,10) >= addDays(today, -1)
    ? fmtTime(syncFitbit.last_sync) : null
  const bw = todayData.bodyWeight
  const wTime = bw && bw.date === today ? (fmtTime(bw.measured_at) || fmtTime(bw.created_at)) : null
  document.getElementById('sync-chips').innerHTML =
    syncChip('FITBIT', syncFitbit, fbTime, 'Steps, sleep, runs and recovery. Nothing synced yet today.') +
    syncChip('WITHINGS', syncWithings, wTime, 'Weight. No weigh-in today yet.')

  const r = mode.ready
  document.getElementById('ready-pill').innerHTML =
    `<div class="ready-pill" style="--c:${r.color}" title="${esc(r.advice)}">
      <span class="ready-dot"></span>${r.verdict} · ${r.short}
    </div>`
  document.getElementById('hdr-date').textContent = fmtDate(today)

  const showBanner = mode.evening && tab !== 'today'
  const en = energy()
  const left = Math.max(0, STEP_TARGET - en.steps)
  document.getElementById('banner-slot').innerHTML = showBanner
    ? `<div class="banner">
        <span class="banner-sq"></span>
        <span class="banner-txt">STREAK AT RISK · ${num(left)} STEPS LEFT TODAY · ≈${Math.round(left/110)} MIN WALK</span>
        <button class="banner-btn" data-act="tab" data-tab="today">GO TO TODAY →</button>
      </div>`
    : ''
}

function heroHTML(mode) {
  const bw = todayData.bodyWeight
  const start = goals.bw_start, goal = goals.bw_goal
  if (!bw || !start || !goal) {
    const kg = bw ? bw.weight_kg : null
    const unit = EMBED
      ? `<span class="hero-unit-col"><span class="hero-kg-unit">KG</span>${lbHTML(kg)}</span>`
      : `<span class="hero-kg-unit">KG</span>`
    return `<div class="hero">
      <div class="hero-top"><span>THE CUT</span></div>
      <div class="hero-num"><span class="hero-kg">${kg != null ? fmtKg(kg) : '—'}</span>${unit}</div>
      <div class="hero-foot">
        <span class="hero-eta">${bw ? 'Set a start and goal weight on the Goals tab.' : 'Log a weight to start the cut.'}</span>
        <button class="hero-btn invert" data-act="open-weight">+ LOG WEIGHT</button>
      </div>
    </div>`
  }
  const w = bw.weight_kg
  const lost = start - w, toGo = w - goal
  const pct = clampPct((start - w) / (start - goal) * 100)
  const proj = projection()
  const weekly = proj.weekly
  const pace = weekly == null ? null : WeightUnits.paceLines(weekly)
  const velTxt = pace ? pace.kgText : '— KG/WK'
  const trackTxt = paceVerdict(weekly, w)
  const etaMs = proj.etaMs
  const cutStart = cutStartDate()
  const day = daysBetween(cutStart, localIso()) + 1

  let eta = etaMs ? `${goal} kg around ${fmtDayMonMs(etaMs)} at this pace`
    : weekly == null ? 'Not enough weigh-ins yet for a pace.'
    : weekly >= -0.05 ? 'No downward trend over the last 14 days.'
    : `${toGo.toFixed(1)} kg to go. This pace is too slow to put a date on.`
  if (mode.notWeighed) {
    const h = [...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
    const n = h[h.length-1]
    eta = n ? `Last weigh-in ${fmtKg(n.weight_kg)} kg on ${fmtDate(n.date)}. Step on the scale before breakfast.`
      : 'Step on the scale before breakfast.'
  }
  const wTime = fmtTime(bw.measured_at) || fmtTime(bw.created_at)
  const status = mode.notWeighed ? 'NOT WEIGHED TODAY' : `WEIGHED${wTime ? ' ' + wTime : ''} ✓`

  const marks = milestones(start, goal).map(([kg, note]) =>
    ({ kg, note, left: ((start - kg) / (start - goal) * 100).toFixed(1) + '%' }))

  const kgUnit = EMBED ? '<small>KG</small>' : ''
  const stats = [
    { lbl:'LOST', val: `${lost >= 0 ? '−' : '+'}${fmtKg(Math.abs(lost))}${kgUnit}${lbHTML(lost)}` },
    { lbl:'TO GO', val: `${toGo.toFixed(1)}${kgUnit}${lbHTML(toGo)}` },
    { lbl:'DONE', val: Math.round(pct) + '%' },
  ]
  const unit = EMBED
    ? `<span class="hero-unit-col"><span class="hero-kg-unit">KG</span>${lbHTML(w)}</span>`
    : `<span class="hero-kg-unit">KG</span>`
  const rangeLb = EMBED ? `<span class="lb">${fmtLb(start)} → ${fmtLb(goal)} LB</span>` : ''
  const velLb = EMBED && pace ? `<span class="lb">${pace.lbText}</span>` : ''
  const vel = velLb
    ? `<span class="hero-vel v3"><span>${velTxt} <i>${trackTxt}</i></span>${velLb}</span>`
    : `<span class="hero-vel">${velTxt} <i>${trackTxt}</i></span>`
  // Embed drops the 100 / 95 captions; the ticks stay. Standalone keeps both.
  const captions = EMBED ? '' : marks.map(k => `<span class="hero-mark" style="--l:${k.left}">${k.kg}<br><i>${k.note}</i></span>`).join('')
  const startLbl = EMBED ? `${start} KG START${lbHTML(start)}` : `${start} START`
  const endLbl = EMBED ? `${goal} KG FINISH ⚑${lbHTML(goal)}` : `${goal} FINISH ⚑`
  return `<div class="hero">
    <div class="hero-top">
      <span>THE CUT · ${start} → ${goal} KG${rangeLb}</span>
      <span class="hero-top-r">
        <span class="hero-status${mode.notWeighed ? ' warn' : ''}">${status}</span>
        <span>DAY ${day}</span>
      </span>
    </div>
    <div class="hero-num"><span class="hero-kg">${fmtKg(w)}</span>${unit}</div>
    <div class="hero-stats">${stats.map(s =>
      `<div><div class="hero-stat-lbl">${s.lbl}</div><div class="hero-stat-val">${s.val}</div></div>`).join('')}</div>
    <div class="hero-barwrap">
      <div class="hero-track" style="--pct:${pct.toFixed(1)}%">
        <div class="hero-fill"></div>
        ${marks.map(k => `<div class="hero-tick" style="--l:${k.left}"></div>`).join('')}
        <div class="hero-marker"></div>
      </div>
      <div class="hero-scale${EMBED ? ' v3' : ''}">
        <span class="s">${startLbl}</span>
        ${captions}
        <span class="e">${endLbl}</span>
      </div>
    </div>
    <div class="hero-foot">
      <div class="hero-foot-l">
        ${vel}
        <span class="hero-eta">${esc(eta)}</span>
      </div>
      <button class="hero-btn${mode.notWeighed ? ' invert' : ''}" data-act="open-weight">+ LOG WEIGHT</button>
    </div>
  </div>`
}

function eveningHTML(mode) {
  const en = energy()
  const m = habitMap()[mode.today] || {}
  const streak = fullDayStreak()
  const bw = todayData.bodyWeight
  const vel = velocity()
  // Whichever pillar is short drives the headline.
  const missing = !(m.steps >= STEP_TARGET) ? 'steps'
    : !(m.sleep_h > 0) ? 'sleep' : !m.diet_ok ? 'food' : 'workout'
  const stepsLeft = Math.max(0, STEP_TARGET - en.steps)
  const walkMin = Math.round(stepsLeft / 110)
  const HEAD = {
    steps: { big: num(stepsLeft), unit: 'STEPS<br>LEFT', act:'+ ADD STEPS', on:'open-steps',
      text: `Three of four done. About ${plural(walkMin, 'minute')} of walking (${(stepsLeft/1333).toFixed(1)} km) makes it 4/4 and takes the streak to ${plural(streak+1, 'day')}. It also adds ${en.walkWorth} kcal to today's budget.` },
    food: { big: num(Math.max(0, en.left)), unit: 'KCAL<br>LEFT', act:'LOG FOOD', on:'open-food',
      text: `Three of four done. Log what you ate and today is 4/4, taking the streak to ${plural(streak+1, 'day')}.` },
    sleep: { big: '—', unit: 'HRS<br>LOGGED', act:'EDIT HOURS', on:'open-sleep',
      text: `Three of four done. Last night has no hours against it, so today sits at 3/4. Fill it in and the streak goes to ${plural(streak+1, 'day')}.` },
    workout: plannedOn(mode.today)
      ? { big: plannedOn(mode.today), unit: 'STILL<br>OPEN', act:'LOG SESSION', on:'open-pick',
          text: `Three of four done. Log today's ${plannedOn(mode.today)} session and today is 4/4, taking the streak to ${plural(streak+1, 'day')}.` }
      : { big: 'REST', unit: 'NO SESSION<br>PLANNED', act:'LOG SESSION', on:'open-pick',
          text: `Three of four done. No session is planned today; a workout of your own would make it 4/4. Next up: ${nextPlannedTxt()}.` },
  }[missing]
  const stats = [
    { lbl:'TODAY', val:`${mode.score}/4` },
    { lbl:'STREAK', val:`${streak} → ${streak+1}` },

  const velTxt = vel ? `${vel.weekly < 0 ? '↓' : '↑'} ${Math.abs(vel.weekly).toFixed(1)} KG/WK` : 'NO TREND YET'
  const track = paceVerdict(vel ? vel.weekly : null)
  return `<div class="evening">
    <div class="evening-top">
      <span>TONIGHT · ${new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}</span>
      <span class="evening-chip">STREAK AT RISK</span>
    </div>
    <div class="evening-num">
      <span class="evening-big">${HEAD.big}</span>
      <span class="evening-unit">${HEAD.unit}</span>
    </div>
    <div class="evening-text">${esc(HEAD.text)}</div>
    <div class="evening-stats">${stats.map(s =>
      `<div><div class="hero-stat-lbl on-dim">${s.lbl}</div><div class="hero-stat-val">${s.val}</div></div>`).join('')}</div>
    <div class="evening-foot">
      <span class="evening-wt">${bw ? `${fmtKg(bw.weight_kg)} KG THIS MORNING${lbHTML(bw.weight_kg)} · ${velTxt} · ${track}` : 'NO WEIGH-IN YET'}</span>
      <button class="evening-btn" data-act="${HEAD.on}">${HEAD.act}</button>
    </div>
  </div>`
}

function scoreCardHTML(mode) {
  const m = habitMap()
  const streak = fullDayStreak()
  const shade = ['rgba(239,233,218,0.1)','rgba(244,168,0,0.22)','rgba(244,168,0,0.45)','rgba(244,168,0,0.7)','#f4a800']
  const off = fbHidden()
  const cells = Array.from({ length:14 }, (_, i) => {
    const dt = addDays(mode.today, i-13)
    const s = dayScore(m[dt], off)
    const max = off ? 2 : 4
    const shadeIdx = off ? s * 2 : s
    return `<div class="strip-cell${dt === mode.today ? ' is-today' : ''}" style="--b:${shade[shadeIdx]}" title="${dt}: ${s}/${max}"></div>`
  }).join('')
  const fullLabel = off ? '2/2 = FULL' : '4/4 = FULL SQUARE'
  return `<div class="score-card">
    <div class="lbl on-dim">TODAY</div>
    <div class="score-row">
      <div class="score-num"><span class="score-val">${mode.score}/${mode.max}</span><span class="lbl-m">DONE</span></div>
      <div style="text-align:right">
        <div class="streak-val">${streak}</div>
        <div class="lbl-s on-dim" style="margin-top:4px">DAY STREAK</div>
      </div>
    </div>
    ${scanRowHTML()}
    <div class="strip-wrap">
      <div class="strip">${cells}</div>
      <div class="strip-cap"><span>LAST 14 DAYS</span><span>${fullLabel}</span></div>
    </div>
  </div>`
}

function stykuScan() {
  const date = goals.styku_date
  const weightLb = parseFloat(goals.styku_weight_lb)
  const bf = parseFloat(goals.styku_bf_pct)
  const leanLb = parseFloat(goals.styku_lean_lb)
  if (!date || !Number.isFinite(weightLb) || !Number.isFinite(bf) || !Number.isFinite(leanLb)) return null
  return { date, weightLb, bf, leanLb }
}

function scanRowHTML() {
  if (!EMBED) return ''
  const s = stykuScan()
  if (!s) return ''
  const wKg = WeightUnits.kgFromLb(s.weightLb)
  const lKg = WeightUnits.kgFromLb(s.leanLb)
  return `<div class="scan-lbl lbl-s on-dim">STYKU SCAN · ${fmtDayMon(s.date)}</div>
    <div class="scan-row">
      <div><b>${Number(s.bf).toFixed(1)}%</b><em>BODY FAT</em></div>
      <div><b>${wKg}<small>KG</small></b><span class="lb">${Number(s.weightLb).toFixed(1)} LB</span><em>WEIGHT</em></div>
      <div><b>${lKg}<small>KG</small></b><span class="lb">${Number(s.leanLb).toFixed(1)} LB</span><em>LEAN MASS</em></div>
    </div>`
}

function recapCardHTML(mode) {
  const m = habitMap()
  const monday = addDays(mode.today, -((new Date(mode.today + 'T12:00:00').getDay() + 6) % 7))
  const prevMon = addDays(monday, -7), prevSun = addDays(monday, -1)
  const days = Array.from({ length:7 }, (_, i) => addDays(prevMon, i))
  const a = bwOn(addDays(prevMon, -1)), b = bwOn(prevSun)
  const lost = a != null && b != null ? a - b : null
  const stats = [
    { lbl:'KG LOST', val: lost == null ? '—' : `${lost >= 0 ? '−' : '+'}${fmtKg(Math.abs(lost))}${lbHTML(lost)}` },
    { lbl:'SESSIONS', val: `${sessions.filter(s => days.includes(s.date)).length} / ${PER_WEEK}` },
    { lbl:'DAYS AT 4/4', val: `${days.filter(d => dayScore(m[d]) === 4).length} / 7` },
    { lbl:'FOOD ON PLAN', val: `${days.filter(d => m[d] && m[d].diet_ok).length} / 7` },
  ]
  const wk = weekNum(new Date(prevMon + 'T12:00:00'))
  const range = `${asDate(prevMon).getDate()}–${asDate(prevSun).getDate()} ${MONTHS[asDate(prevSun).getMonth()]}`
  const reconnect = syncFitbit.ok === false ? ' FITBIT NEEDS A RECONNECT FIRST.' : ''
  return `<div class="score-card">
    <div style="display:flex;justify-content:space-between;gap:12px">
      <span class="lbl">WEEK ${wk} RECAP</span><span class="lbl on-dim">${range}</span>
    </div>
    <div class="recap-stats">${stats.map(s =>
      `<div><div class="lbl-s on-dim">${s.lbl}</div><div class="recap-val">${s.val}</div></div>`).join('')}</div>
    <div class="recap-foot">NEXT UP: ${nextPlannedTxt()}.${reconnect}</div>
  </div>`
}

function whyCardHTML() {
  return `<div class="why-card">
    <div class="lbl dim">YOUR WHY</div>
    <div class="why-text">${esc(goals.why)}</div>
    <div class="why-foot">Shows on RED days and after a weigh-in bump.</div>

function readyCardHTML(mode) {

  return `<div class="ready-card" style="--c:${r.color}">

    <div class="ready-advice">${esc(r.advice)}</div>

  </div>`
