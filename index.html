function pillarsHTML(mode) {
  const en = energy()
  const sl = todayData.todaySleepHours || 0
  const today = mode.today
  const todaySession = sessions.find(s => s.date === today)
  const fbDown = syncFitbit.ok === false

  const done = (c, fg) => ({ cls:'done', c, fg, tag:'✓ DONE' })
  const todo = { cls:'', c:CARD, fg:INK, tag:'TO DO' }

  // SLEEP
  const sleep = { ...(sl >= SLEEP_TARGET ? done(BLUE, PAPER) : todo), label:'SLEEP',
    val: sl ? sl.toFixed(1) : '—', unit:'HRS', sub:'Synced from Fitbit. Target 7h.',
    action:'EDIT HOURS', act:'open-sleep' }
  if (fbDown) Object.assign(sleep, { cls:'', c:CARD, fg:INK, tag:'TO DO', val:'—',
    sub:"Fitbit disconnected, so last night didn't sync.", action:'RECONNECT FITBIT',
    act:'reconnect', url: syncFitbit.reconnect_url || '/auth/google-health', btn:'warn' })
  else if (sl > 0 && sl < SLEEP_TARGET) sleep.sub = `Synced from Fitbit. ${(SLEEP_TARGET-sl).toFixed(1)}h short of 7h.`

  // FOOD
  const food = { ...(todayData.todayDiet ? done(GREEN, PAPER) : todo), label:'FOOD',
    val: num(en.eaten), unit:'KCAL', action:'LOG FOOD', act:'open-food',
    bar: en.eatToday ? clampPct(en.eaten / en.eatToday * 100) : 0,
    sub: en.needsProfile ? 'Add height and birth date in EDIT GOALS to size the budget.'
      : !en.ok ? 'Log a weight to size the budget.'
      : !en.eaten ? `Nothing logged yet. Today's budget is ${num(en.eatToday)} kcal.`
      : en.over ? `${num(Math.abs(en.left))} over today's ${num(en.eatToday)} budget`
      : `${num(en.left)} left of today's ${num(en.eatToday)} budget` }

  // STEPS
  const stepsDone = en.steps >= STEP_TARGET
  const steps = { ...(stepsDone ? done(GOLD, INK) : todo), label:'STEPS',
    val: en.steps ? num(en.steps) : '—', unit:`/ ${fmtKg(STEP_TARGET / 1000)}K`, action:'+ ADD STEPS', act:'open-steps',
    bar: clampPct(en.steps / STEP_TARGET * 100),
    sub: fbDown ? 'Waiting on Fitbit.'
      : stepsDone ? `Target hit. Today's budget is ${num(en.eatToday)} kcal.`
      : `${num(STEP_TARGET - en.steps)} to go. Walking there is worth +${en.walkWorth} kcal.` }
  if (fbDown && !en.steps) { steps.val = '—'; steps.bar = null }

  // WORKOUT
  // Coach-led sessions (PT) carry no sets, so the tile describes the session, not volume.
  const planned = plannedOn(today)
  const plannedProg = planned ? programOf(planned) : null
  let workout
  if (todaySession) {
    const t = typeOf(todaySession)
    const time = fmtTime(todaySession.ended_at) || fmtTime(todaySession.created_at)
    const p = programOf(t)
    workout = { ...done(INK, PAPER), label:'WORKOUT', val:t, unit: time || 'TODAY',
      sub: p && p.coach && !todaySession.total_sets
        ? `${p.place} session with ${p.coach.split(' ')[0]}.${todaySession.note ? ` ${todaySession.note}` : ''}`
        : `${plural(todaySession.total_sets || 0, 'set')}${todaySession.volume_kg ? ` · ${num(Math.round(todaySession.volume_kg))} kg` : ''}.`,
      action:'VIEW SESSION', act:'session', id: todaySession.id }
  } else if (mode.red) {
    workout = { ...todo, tag:'REST', label:'WORKOUT', val:'WALK', unit:'REST DAY', btn:'', act:'open-note',
      sub: `${[mode.ready.rhrUp >= 1 ? `RHR +${Math.round(mode.ready.rhrUp)}` : null,
        sl ? `${sl.toFixed(1)}h sleep` : 'no sleep logged'].filter(Boolean).join(' and ')}. Walk and mobility today.${planned ? ` Tell ${plannedProg && plannedProg.coach ? plannedProg.coach.split(' ')[0] : 'your coach'} before the session.` : ` Next up: ${nextPlannedTxt()}.`}`,
      action:'LOG MOBILITY' }
  } else if (planned) {
    const p = plannedProg || {}
    const lastP = lastSessionOfType(planned)
    workout = { ...todo, label:'WORKOUT', val:planned, unit: p.time || 'TODAY', btn:'cta',
      sub: p.coach
        ? `${p.place} personal training with ${p.coach.split(' ')[0]}, who picks the exercises.${lastP ? ` Last: ${fmtDate(lastP.date)}.` : ''}`
        : lastP ? `Last ${planned}: ${fmtDate(lastP.date)}, ${plural(lastP.total_sets || 0, 'set')}.` : `No ${planned} on record yet.`,
      action:`LOG ${planned} →`, act:'open-log', type:planned }
  } else {
    workout = { ...todo, tag:'REST', label:'WORKOUT', val:'REST', unit:'WALK DAY', btn:'',
      sub: `No session planned. Hit the steps, or log a workout of your own. Next up: ${nextPlannedTxt()}.`,
      action:'LOG SESSION', act:'open-pick' }
  }

  const list = fbHidden() ? [food, workout] : [sleep, food, steps, workout]
  return list.map(p => {
    const attrs = [`data-act="${p.act || ''}"`]
    if (p.type) attrs.push(`data-type="${p.type}"`)
    if (p.id) attrs.push(`data-id="${p.id}"`)
    if (p.url) attrs.push(`data-url="${esc(p.url)}"`)
    return `<div class="pillar ${p.cls}" style="--c:${p.c};--fg:${p.fg}">
      <div class="pillar-top"><span class="pillar-lbl lbl">${p.label}</span><span class="pillar-tag">${p.tag}</span></div>
      <div class="pillar-num"><span class="pillar-val${p.val === '—' ? ' na' : ''}">${p.val}</span><span class="pillar-unit">${p.unit}</span></div>
      <div class="pillar-sub">${esc(p.sub)}</div>
      ${p.bar != null ? `<div class="pillar-bar"><i style="--w:${p.bar}%"></i></div>` : ''}
      <button class="pillar-btn ${p.btn || ''}" ${attrs.join(' ')}>${p.action}</button>
    </div>`
  }).join('')
}

function weekStripHTML() {
  const today = localIso()
  const monday = addDays(today, -((new Date(today + 'T12:00:00').getDay() + 6) % 7))
  const DAYN = ['MON','TUE','WED','THU','FRI','SAT','SUN']
  const byDate = {}; sessions.forEach(s => { if (!byDate[s.date]) byDate[s.date] = s })
  let done = 0

  const cells = Array.from({ length:7 }, (_, i) => {
    const iso = addDays(monday, i)
    const planned = plannedOn(iso)
    const s = byDate[iso]
    const walk = runs.find(r => r.date === iso && isWalk(r))
    const isToday = iso === today, future = iso > today
    let chip = '', chipBg = 'transparent', chipFg = MUTED, chipBorder = 'transparent', chipStyle = 'solid'
    if (s) {
      const t = typeOf(s); done++
      chip = `${t} ✓`; chipBg = typeColor(t); chipFg = typeFg(t); chipBorder = typeColor(t)
    } else if (isToday && planned) {
      chip = `${planned} TODAY`; chipBg = GOLD; chipFg = INK; chipBorder = GOLD
    } else if (planned && future) {
      chip = planned; chipBorder = typeColor(planned); chipStyle = 'dashed'
    } else if (!planned) {
      chip = 'REST'; chipFg = isToday ? PAPER : MUTED
    } else {
      chip = `${planned} MISSED`; chipBorder = '#cabfa6'; chipStyle = 'dashed'
    }
    const open = s ? `data-act="session" data-id="${s.id}" style="cursor:pointer"` : ''
    return `<div class="week-cell${isToday ? ' is-today' : ''}" ${open}>
      <div class="week-cell-top"><span>${DAYN[i]}</span><span>${isToday ? 'TODAY' : ''}</span></div>
      <div class="week-cell-num">${asDate(iso).getDate()}</div>
      <div class="week-cell-foot">
        <span class="week-chip" style="background:${chipBg};color:${chipFg};border-color:${chipBorder};border-style:${chipStyle}">${chip}</span>
        ${walk ? `<span class="week-extra">WALK ${walk.distance_km.toFixed(1)} KM</span>` : ''}
      </div>
    </div>`
  }).join('')
  return { html: cells, done }
}

function recentSessionsHTML() {
  const nos = sessionNumbers()
  const list = sessions.filter(s => s.total_sets > 0).slice(0, 4)
  if (!list.length) return `<div class="sess-card"><div class="sess-row"><div class="empty">No sessions with sets logged yet.</div></div></div>`
  return `<div class="sess-card">${list.map((s, i) => {
    const t = typeOf(s)
    const no = nos[s.id] ? `No. ${String(nos[s.id]).padStart(3,'0')}` : `#${s.id}`
    const bw = bwOn(s.date)
    const open = i === 0 && s.exercises && s.exercises.length
    const rows = open ? s.exercises.filter(e => (e.sets || []).length).map(e => {
      const kg = Math.max(...e.sets.map(x => x.weight_kg || 0))
      return `<button class="sess-ex" data-act="drawer" data-name="${esc(e.name)}"><u>${esc(e.name)}</u></button>
        <span class="sess-kg">${kg ? fmtKg(kg) : 'BW'}</span>
        <span class="sess-reps">${e.sets.map(x => x.reps).join(', ')}</span>`
    }).join('') : ''
    return `<div class="sess-row">
      <div class="sess-head">
        <button class="sess-chip" style="--c:${typeColor(t)};--fg:${typeFg(t)}" data-act="session" data-id="${s.id}">■ SESSION ${no} · ${t}</button>
        <span class="sess-date">${fmtDate(s.date)}${bw ? ` · ${fmtKg(bw)} KG BW${lbHTML(bw)}` : ''}</span>
        <span class="sess-meta">${s.exercise_count} EXERCISES · ${s.total_sets} SETS${s.volume_kg ? ` · ${num(Math.round(s.volume_kg))} KG` : ''}</span>
      </div>
      ${rows ? `<div class="sess-table">
        <span class="sess-th">EXERCISE</span><span class="sess-th">KG</span><span class="sess-th">REPS</span>${rows}
      </div>` : ''}
      ${s.note ? `<div class="sess-note">Focus: ${esc(s.note)}</div>` : ''}
    </div>`
  }).join('')}</div>`
}

function yearGridHTML() {
  const today = localIso()
  const byDate = {}; sessions.forEach(s => { if (!byDate[s.date]) byDate[s.date] = s })
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC']
  let cur = YEAR_START
  while (asDate(cur).getDay() !== 1) cur = addDays(cur, -1)
  const cols = [], months = [], seen = new Set()
  while (cur <= today) {
    const cells = []
    const mo = asDate(cur).getMonth()
    if (!seen.has(mo) && cur >= YEAR_START) { seen.add(mo); months.push({ label:MON[mo], left: cols.length*17 }) }
    for (let k = 0; k < 7; k++) {
      const inYear = cur >= YEAR_START && cur <= today
      const s = byDate[cur]
      const bg = !inYear ? 'transparent' : s ? typeColor(typeOf(s)) : 'var(--grid-empty)'
      const click = s ? ` data-act="session" data-id="${s.id}" style="cursor:pointer;background:${bg}"` : ` style="background:${bg}"`
      cells.push(`<div class="grid-cell" title="${cur}${s ? ' · ' + typeOf(s) : ''}"${click}></div>`)
      cur = addDays(cur, 1)
    }
    cols.push(cells.join(''))
  }
  const year = sessions.filter(s => s.date >= YEAR_START)
  const other = year.filter(s => !isLift(s)).length
  const shownTypes = Object.keys(TYPE_COLOR).filter(t => t === 'PT' || year.some(s => typeOf(s) === t))
  const legend = shownTypes.map(t =>
    `<div class="grid-legend-row"><span class="grid-legend-sw" style="--c:${TYPE_COLOR[t]}"></span><span>${t}</span><b>${year.filter(s => typeOf(s) === t).length}</b></div>`).join('')
    + (other ? `<div class="grid-legend-row"><span class="grid-legend-sw" style="--c:${MUTED}"></span><span>CARDIO</span><b>${other}</b></div>` : '')
  return `<div class="grid-card">
    <div class="grid-scroll">
      <div class="grid-days">${['M','T','W','T','F','S','S'].map(l => `<div>${l}</div>`).join('')}</div>
      <div>
        <div class="grid-months">${months.map(m => `<span style="--l:${m.left}px">${m.label}</span>`).join('')}</div>
        <div class="grid-cols">${cols.map(c => `<div class="grid-col">${c}</div>`).join('')}</div>
      </div>
    </div>
    <div class="grid-legend">${legend}</div>
  </div>`
}

function exColor(name) {
  const n = name.toLowerCase()
  if (/leg|squat|deadlift|calf|lunge|abduction|crunch/.test(n)) return TYPE_COLOR.LEGS
  if (/bench|press|dip|lateral|fly|pushdown|tricep/.test(n)) return TYPE_COLOR.PUSH
  return TYPE_COLOR.PULL
}

function liftsHTML() {
  // Scoped to this year, like the rest of the Training page. All-time bests live on Goals.
  const group = rows => {
    const byEx = {}
    rows.forEach(r => {
      const k = r.name.toLowerCase().trim()
      if (!byEx[k]) byEx[k] = { name:r.name, vals:[] }
      byEx[k].vals.push(r.max_kg)
    })
    return Object.values(byEx).filter(e => e.vals.length >= 3)
      .sort((a,b) => b.vals.length - a.vals.length).slice(0, 4)
  }
  let top = group(liftHistory.filter(r => r.date >= YEAR_START))
  if (!top.length) top = group(liftHistory)
  if (!top.length) return `<div class="empty">Log a few sessions and lift progression shows up here.</div>`
  return `<div class="lifts">${top.map(e => {
    const cur = e.vals[e.vals.length-1], d = cur - e.vals[0]
    const c = exColor(e.name)
    return `<div class="lift-card">
      <div class="lift-name">${esc(e.name.toUpperCase())} · ${YEAR}</div>
      <div class="lift-row">
        <span class="lift-cur">${fmtKg(cur)}</span><span class="lift-unit">KG</span>
        <span class="lift-delta" style="--c:${c}33">${d >= 0 ? '+' : '−'}${fmtKg(Math.abs(d))} KG</span>
      </div>
      <svg class="lift-spark" viewBox="0 0 200 40" preserveAspectRatio="none">
        <polyline points="${sparkLine(e.vals)}" fill="none" stroke="${c}" stroke-width="3"
          stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
      </svg>
    </div>`
  }).join('')}</div>`
}

function runningHTML() {
  const real = realRuns()
  const yearRuns = real.filter(r => r.date >= YEAR_START)
  const yBest = fastest5k(yearRuns)
  const yearKm = yearRuns.reduce((a,r) => a + r.distance_km, 0)
  const stats = [
    { lbl:`KM IN ${YEAR}`, val: yearKm.toFixed(1) },
    { lbl:`BEST 5K · ${YEAR}`, val: yBest ? fmtDur(yBest.duration_sec) : '—' },
    { lbl:`RUNS IN ${YEAR}`, val: yearRuns.length },
    { lbl:'LAST RUN', val: yearRuns.length ? fmtDate(yearRuns[0].date).slice(4) : '—' },
  ]
  const cards = yearRuns.slice(0, 4).map(r => {
    const best = yBest && r.id === yBest.id
    return `<div class="run-card${best ? ' best' : ''}">
      <div class="run-card-top"><span>${fmtDate(r.date)}</span><i>${best ? `${YEAR} BEST` : ''}</i></div>
      <div class="run-time">${r.duration_sec ? fmtDur(r.duration_sec) : r.distance_km.toFixed(1) + ' KM'}</div>
      <div class="run-detail">${r.duration_sec ? `${r.distance_km.toFixed(1)} KM${fmtPace(r.distance_km, r.duration_sec) ? ' · ' + fmtPace(r.distance_km, r.duration_sec) : ''}` : 'NO TIME LOGGED'}</div>
    </div>`
  }).join('')
  return `<div class="stat-strip">${stats.map(s =>
    `<div class="stat-cell"><div class="lbl-s">${s.lbl}</div><div class="stat-val">${s.val}</div></div>`).join('')}</div>
    ${cards ? `<div class="run-cards">${cards}</div>` : `<div class="empty">No runs logged this year. Walks are not counted.</div>`}`
}

function paceChartHTML() {
  const start = goals.bw_start, goal = goals.bw_goal
  const bw = todayData.bodyWeight
  if (!start || !goal || !bw) return { card:'' }
  const cutStart = cutStartDate()
  const DAY = 86400000
  const t0 = asDate(cutStart).getTime()
  const planEnd = t0 + ((start - goal) / PLAN_KG_PER_WEEK) * 7 * DAY
  const hist = [...(todayData.bwHistory || [])].filter(x => x.date >= cutStart)
    .sort((a,b) => a.date < b.date ? -1 : 1)
  const w = bw.weight_kg
  const proj = projection()
  const weekly = proj.weekly
  const nowMs = asDate(localIso()).getTime()
  const etaMs = proj.etaMs
  const tEnd = Math.max(planEnd, etaMs || 0, nowMs) + 10*DAY

  const maxKg = Math.max(start, ...hist.map(h => h.weight_kg))
  const yTop = Math.ceil(maxKg) + 1, yBot = goal - 1
  const X = t => 20 + (t - t0) / (tEnd - t0) * 1140
  const Y = kg => 12 + (yTop - kg) / (yTop - yBot) * 196
  const ticks = []
  for (let kg = goal; kg <= yTop - 1; kg += 10) ticks.push(kg)

  const months = []
  const m0 = new Date(t0); m0.setDate(1); m0.setMonth(m0.getMonth() + 1)
  for (let d = new Date(m0); d.getTime() <= tEnd; d.setMonth(d.getMonth() + 1)) {
    months.push({ x: X(d.getTime()), label: MONTHS[d.getMonth()] })
  }
  // The plan stops at the goal: once its date has passed, the target is the goal itself.
  const planNow = Math.max(goal, start - (nowMs - t0) / DAY / 7 * PLAN_KG_PER_WEEK)
  const ahead = planNow - w
  const actual = hist.map(p => `${X(asDate(p.date).getTime()).toFixed(1)},${Y(p.weight_kg).toFixed(1)}`).join(' ')
  const goalY = Y(goal), lblY = goalY - 14

  const stats = [
    { lbl:'PLAN', val:`${PLAN_KG_PER_WEEK.toFixed(1)} KG/WK` },
    { lbl:'ACTUAL · 14D', val: weekly == null ? '—' : `${weekly > 0 ? '+' : '−'}${Math.abs(weekly).toFixed(1)} KG/WK` },
    { lbl:`${goal} KG`, val: etaMs ? `~${fmtDayMonMs(etaMs)}` : '—' },
  ]
  return { card: `<div class="pace-card">
    <div class="pace-left">
      <div class="lbl">THE CUT · ACTUAL VS PLAN</div>
      <div>
        <div class="pace-ahead" style="--c:${ahead >= 0 ? GREEN : RED}">${ahead >= 0 ? '+' : '−'}${Math.abs(ahead).toFixed(1)}</div>
        <div class="pace-ahead-lbl">${ahead >= 0 ? 'KG AHEAD OF PLAN' : 'KG BEHIND PLAN'}</div>
      </div>
      ${stats.map(s => `<div class="pace-stat"><span>${s.lbl}</span><b>${s.val}</b></div>`).join('')}
    </div>
    <div style="min-width:0">
      <div class="pace-legend">
        <span><i style="height:4px;background:${RED}"></i>ACTUAL</span>
        <span><i style="height:0;border-top:3px dotted ${RED}"></i>AT THIS PACE</span>
        <span><i style="height:0;border-top:2px dashed ${INK}"></i>PLAN · ${PLAN_KG_PER_WEEK} KG/WK</span>
      </div>
      <svg class="pace-svg" viewBox="0 0 1220 240" preserveAspectRatio="xMidYMid meet">
        ${ticks.map(kg => `<line x1="20" x2="1180" y1="${Y(kg).toFixed(1)}" y2="${Y(kg).toFixed(1)}" stroke="#ddd5c2" stroke-width="1.5"></line>
          <text x="1190" y="${(Y(kg)+4).toFixed(1)}" font-family="Archivo,sans-serif" font-weight="800" font-size="12" fill="${MUTED}">${kg}</text>`).join('')}
        ${months.map(m => `<text x="${m.x.toFixed(1)}" y="236" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="12" letter-spacing="1" fill="${MUTED}">${m.label}</text>`).join('')}
        <polyline points="${X(t0).toFixed(1)},${Y(start).toFixed(1)} ${X(planEnd).toFixed(1)},${goalY.toFixed(1)} ${X(tEnd).toFixed(1)},${goalY.toFixed(1)}" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="8 6"></polyline>
        ${etaMs ? `<polyline points="${X(nowMs).toFixed(1)},${Y(w).toFixed(1)} ${X(etaMs).toFixed(1)},${goalY.toFixed(1)}" fill="none" stroke="${RED}" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"></polyline>` : ''}
        <polyline points="${actual}" fill="none" stroke="${RED}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <circle cx="${X(nowMs).toFixed(1)}" cy="${Y(w).toFixed(1)}" r="7" fill="${RED}" stroke="${INK}" stroke-width="2"></circle>
        ${etaMs ? `<circle cx="${X(etaMs).toFixed(1)}" cy="${goalY.toFixed(1)}" r="6" fill="${RED}"></circle>
          <text x="${X(etaMs).toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="12" letter-spacing="1" fill="${RED}">~${fmtDayMonMs(etaMs)}</text>` : ''}
        <circle cx="${X(planEnd).toFixed(1)}" cy="${goalY.toFixed(1)}" r="6" fill="${INK}"></circle>
        <text x="${X(planEnd).toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="12" letter-spacing="1" fill="${INK}">PLAN ${fmtDayMonMs(planEnd)}</text>
      </svg>
    </div>
  </div>` }
}

function cutCardHTML() {
  const bw = todayData.bodyWeight
  const start = goals.bw_start, goal = goals.bw_goal
  if (!bw || !start || !goal) return `<div class="cut-card" style="grid-template-columns:1fr">
    <div class="cut-left"><div class="lbl">BODYWEIGHT · THE CUT</div>
      <div class="cut-summary">Set a start and goal weight to track the cut.</div></div></div>`
  const w = bw.weight_kg
  const pct = clampPct((start - w) / (start - goal) * 100)
  const proj = projection()
  const etaMs = proj.etaMs
  const hist = [...(todayData.bwHistory || [])].sort((a,b) => a.date < b.date ? -1 : 1)
  const moved = start - w
  const since = fmtDayMon(cutStartDate())
  const summary = (moved >= 0
      ? `${fmtKg(moved)} kg down since ${since}, ${(w-goal).toFixed(1)} to go. `
      : `${fmtKg(-moved)} kg up on the ${since} start, ${(w-goal).toFixed(1)} to go. `)
    + (proj.weekly == null ? 'Not enough weigh-ins yet for a 14-day average.'
      : proj.weekly > 0 ? `Gaining ${proj.weekly.toFixed(1)} kg a week over the last 14 days, so the cut is going backwards.`
      : etaMs ? `Losing ${Math.abs(proj.weekly).toFixed(1)} kg a week over the last 14 days, which lands around ${fmtDayMonMs(etaMs)}.`
      : `Losing ${Math.abs(proj.weekly).toFixed(1)} kg a week over the last 14 days, short of the ${PLAN_KG_PER_WEEK} kg a week the plan needs.`)
  // Ink on red: the chart's paper strokes become ink and its gold becomes ink too.
  const chart = heroChartSVG(hist, goal, { clean:true, label:1.45, ink:'26,22,16', accent:'26,22,16', W:760, H:300 })
  return `<div class="cut-card">
    <div class="cut-left">
      <div class="lbl">BODYWEIGHT · THE CUT</div>
      <div class="cut-num">${EMBED
        ? `<span class="cut-val-col"><span class="cut-val">${fmtKg(w)}</span>${lbHTML(w)}</span><span class="cut-target">→ ${goal} KG${lbHTML(goal)}</span>`
        : `<span class="cut-val">${fmtKg(w)}</span><span class="cut-target">→ ${goal} KG</span>`}</div>
      <div class="cut-pct">${Math.round(pct)}% <span>OF THE WAY</span></div>
      <div class="cut-bar" style="--pct:${pct.toFixed(1)}%"><i></i></div>
      <div class="cut-summary">${esc(summary)}</div>
    </div>
    <div class="cut-right">
      <div class="cut-chart-head"><span>10 YEARS OF WEIGH-INS · 7-DAY AVERAGE</span><span>DASHED = ${PLAN_KG_PER_WEEK} KG/WK TO GOAL</span></div>
      <div class="cut-chart">${chart}</div>
    </div>
  </div>`
}

function goalTilesHTML() {
  const real = realRuns()
  const yearRuns = real.filter(r => r.date >= YEAR_START)
  const yearSess = sessions.filter(s => s.date >= YEAR_START && isLift(s))
  const yearKm = yearRuns.reduce((a,r) => a + r.distance_km, 0)
  const yBest = fastest5k(yearRuns)
  const bench = yearPrs['bench press'] || null
  const benchGoal = goals.bench_goal || 100
  const allBench = prs['bench press'] || null

  const tiles = [
    { lbl:`5K RUN · ${YEAR}`, c:BLUE, fg:PAPER, accent:PAPER, track:'rgba(239,233,218,0.25)',
      pct: yBest ? clampPct(Math.round((2400 - yBest.duration_sec) / 600 * 100)) : 0,
      val: yBest ? fmtDur(yBest.duration_sec) : '—', target:'→ SUB 30:00',
      sub: yBest ? (yBest.duration_sec <= 1800
          ? `Done, ${fmtKg((1800 - yBest.duration_sec)/60)} min under target.`
          : `${fmtKg((yBest.duration_sec - 1800)/60)} min to find. Parked until ~105 kg.`)
        : `No timed 5K in ${YEAR} yet. Parked until ~105 kg.` },
    { lbl:`BENCH PRESS · ${YEAR}`, c:INK, fg:PAPER, accent:GOLD, track:'rgba(239,233,218,0.2)',
      pct: bench ? clampPct(Math.round(bench / benchGoal * 100)) : 0,
      val: bench ? fmtKg(bench) : '—', target:`→ ${benchGoal} KG`,
      sub: bench ? `${fmtKg(Math.max(0, benchGoal - bench))} kg to go.${allBench ? ` All-time best ${fmtKg(allBench)} kg.` : ''}`
        : 'Log a bench press to track this.' },
    { lbl:`SESSIONS · ${YEAR}`, c:GOLD, fg:INK, accent:INK, track:'rgba(26,22,16,0.2)',
      pct: clampPct(yearSess.length), val: yearSess.length, target:'→ 100',
      sub: `${Math.max(0, 100 - yearSess.length)} to go. Lifting only, cardio days not counted.` },
    { lbl:`RUNNING · ${YEAR}`, c:GREEN, fg:PAPER, accent:PAPER, track:'rgba(239,233,218,0.25)',
      pct: clampPct(Math.round(yearKm)), val: fmtKg(yearKm), target:'→ 100 KM',
      sub: `${fmtKg(Math.max(0, 100 - yearKm))} km to go. Walks not counted.` },
  ]
  return `<div class="goal-tiles">${tiles.map(t =>
    `<div class="goal-tile" style="--c:${t.c};--fg:${t.fg};--accent:${t.accent};--track:${t.track}">
      <div class="goal-tile-top"><span class="lbl-s">${t.lbl}</span><span class="goal-tile-pct">${t.pct}%</span></div>
      <div class="goal-tile-num"><span class="goal-tile-val${t.val === '—' ? ' na' : ''}">${t.val}</span><span class="goal-tile-target">${t.target}</span></div>
      <div class="goal-tile-bar"><i style="--w:${t.pct}%"></i></div>
      <div class="goal-tile-sub">${esc(t.sub)}</div>
    </div>`).join('')}</div>`
}

const modalRoot = () => document.getElementById('modal-root')

function shell({ title, sub, body, ghost, primary, primaryAct, ghostAct, wide, spine }) {
  return `<div class="scrim" data-act="close-scrim">
    <div class="modal${wide ? '' : ' sm'}" data-stop="1">
      <div class="modal-head${spine ? ' spine' : ''}"${spine ? ` style="--c:${spine}"` : ''}>

      <div class="modal-body">${body}</div>
      ${primary ? `<div class="modal-foot">
        <button class="g" data-act="${ghostAct || 'close'}">${ghost || 'CANCEL'}</button>
        <button class="p" data-act="${primaryAct}">${primary}</button>
      </div>` : ''}
    </div>
  </div>`
}

// ── log phase ──
// Progression: GREEN readiness plus every set at the prescribed reps last time earns
// +2.5 kg (+2 kg under 20 kg). Anything else holds the last weight. AMBER and RED hold.
async function openLog(type) {
  const prog = PROGRAMS.find(p => p.short === type)
  if (!prog) return
  const ready = readiness()
  const progressionOn = ready.verdict === 'GREEN'
  modalRoot().innerHTML = shell({ title: prog.name, sub:'LOADING LAST SESSION…', wide:true, spine: typeColor(type), body:'' })

  const hist = await Promise.all(prog.exercises.map(ex =>
    api('GET', `/api/exercise-history/${encodeURIComponent(ex.name)}`)))

  draftProgram = prog
  draftNote = ''
  draftLog = prog.exercises.map((ex, i) => {
    const h = hist[i] || {}
    const best = h.best_kg || prs[ex.name.toLowerCase().trim()] || null
    const withSets = (h.history || []).filter(x => (x.sets || []).length)
    const last = withSets[0] || null
    const lastSets = last ? last.sets : []
    // A bodyweight-only entry carries no number, so the prefill falls back to the most
    // recent session that did, and then to the all-time best.
    const weighted = withSets.find(x => x.sets.some(s => s.weight_kg > 0))
    const wSets = weighted ? weighted.sets.filter(s => s.weight_kg > 0) : []
    const lw = wSets.length ? (wSets[wSets.length-1].weight_kg || 0) : (best || 0)
    const hit = lastSets.length > 0 && lastSets.every(s => s.reps >= ex.defaultReps)
    const short = lastSets.reduce((a,s) => a + Math.max(0, ex.defaultReps - s.reps), 0)
    const inc = lw && lw < 20 ? 2 : 2.5
    const up = progressionOn && hit && lw > 0
    const target = up ? lw + inc : lw
    return {
      name: ex.name, defaultReps: ex.defaultReps,
      lastStr: lastSets.length ? `${lastSets[0].weight_kg ? fmtKg(lastSets[0].weight_kg) : 'BW'} ×${lastSets.map(s => s.reps).join(',')}` : '—',
      maxStr: best ? fmtKg(best) : '—',
      up,
      tag: up ? `▲ GO UP +${inc} KG` : lw ? `HOLD · ${fmtKg(lw)} KG` : 'BODYWEIGHT',
      why: !lastSets.length ? 'No history yet. Pick a weight you can own.'
        : up ? `All ${lastSets.length} sets hit ${ex.defaultReps} last time.`
        : short > 0 ? `${short} rep${short === 1 ? '' : 's'} short of ${lastSets.length}×${ex.defaultReps} last time. Stay until it's clean.`
        : progressionOn ? 'Hold here until it is clean.' : `Readiness ${ready.verdict}, so weights hold.`,
      note:'',
      sets: Array.from({ length: ex.sets }, () => ({ weight: target ? String(target) : '', reps: String(ex.defaultReps) })),
    }
  })

  if (prog.coach) {
    modalRoot().innerHTML = shell({
      title: prog.name, wide:true, spine: typeColor(type),
      sub: `${prog.place.toUpperCase()} · ${prog.coach.toUpperCase()} · READINESS ${ready.verdict}`,
      body: `<div class="modal-hint">${esc(prog.coach.split(' ')[0])} picks the exercises, so there are no fixed sets. Note what you did and how it felt.</div>
      <div class="log-sess-note">
        <div class="lbl-s">SESSION NOTE</div>
        <input id="in-sess-note" placeholder="What did you work on?">
      </div>`,
      ghost:'← BACK', ghostAct:'open-pick', primary:'FINISH SESSION', primaryAct:'save-session',
    })
    return
  }
  modalRoot().innerHTML = shell({
    title: prog.name, wide:true, spine: typeColor(type),
    sub: `READINESS ${ready.verdict} · ${progressionOn ? 'PROGRESSION ON' : 'HOLD WEIGHTS'} · ${prog.exercises.length} EXERCISES`,
    body: draftLog.map((ex, i) => `<div class="log-ex">
      <div class="log-ex-head">
        <span class="log-ex-name">${esc(ex.name)}</span>
        <div class="log-ex-pills">
          <span class="pill-last">LAST ${esc(ex.lastStr)}</span>
          <span class="pill-max">MAX ${esc(ex.maxStr)}</span>
        </div>
      </div>
      <div class="log-prog">
        <span class="log-prog-tag${ex.up ? ' up' : ''}">${ex.tag}</span>
        <span class="log-prog-why">${esc(ex.why)}</span>
      </div>
      <div class="log-sets">
        <span class="th">SET</span><span class="th">KG</span><span></span><span class="th">REPS</span>
        ${ex.sets.map((s, j) => `<span class="log-set-n">${j+1}</span>
          <input class="log-in" type="number" step="0.5" inputmode="decimal" value="${esc(s.weight)}" data-ex="${i}" data-set="${j}" data-f="weight">
          <span class="log-x">×</span>
          <input class="log-in" type="number" inputmode="numeric" value="${esc(s.reps)}" data-ex="${i}" data-set="${j}" data-f="reps">`).join('')}
        <input class="log-note" placeholder="+ Note: how did it feel?" data-ex="${i}" data-f="note">
      </div>
    </div>`).join('') + `<div class="log-sess-note">
      <div class="lbl-s">SESSION NOTE</div>
      <input id="in-sess-note" placeholder="How did the whole session feel?">
    </div>`,
    ghost:'← BACK', ghostAct:'open-pick', primary:'FINISH SESSION', primaryAct:'save-session',
  })
}

async function saveSession() {
  if (!draftProgram) return
  const btn = modalRoot().querySelector('[data-act="save-session"]')
  if (btn) { btn.textContent = 'SAVING…'; btn.disabled = true }
  const before = { ...prs }
  const exercises = draftLog.map(ex => ({
    name: ex.name,
    weight_kg: parseFloat(ex.sets[0]?.weight) || null,
    note: ex.note,
    sets: ex.sets.map(s => ({ reps: s.reps, weight_kg: parseFloat(s.weight) || null })),
  }))
  const saved = await api('POST', '/api/log', {
    name: draftProgram.name, type: draftProgram.short, color: typeColor(draftProgram.short),
    note: draftNote, date: localIso(), exercises,
  })
  if (!saved) { if (btn) { btn.textContent = 'FINISH SESSION'; btn.disabled = false }; alert('Failed to save session'); return }
  closeModal()
  await reload(['sessions','today','prs','lifts','habits'])

  // PR moment: any set heavier than the stored best for that lift.
  const hits = []
  draftLog.forEach(ex => {
    const key = ex.name.toLowerCase().trim()
    const prev = before[key] || 0
    const top = ex.sets.reduce((a,s) => Math.max(a, parseFloat(s.weight) || 0), 0)
    const reps = ex.sets.filter(s => (parseFloat(s.weight) || 0) === top).map(s => parseInt(s.reps) || 0)
    if (top > prev && top > 0) hits.push({ name: ex.name, kg: top, prev, jump: top - prev, reps: Math.max(...reps, 0) })
  })
  if (hits.length) {
    hits.sort((a,b) => b.jump - a.jump)
    showPR(hits, saved)
  } else {
    setTab('training')
  }
}

// ── PR moment ──
function showPR(hits, session) {
  const h = hits[0]
  const nos = sessionNumbers()
  const no = nos[session.id] ? `No. ${String(nos[session.id]).padStart(3,'0')}` : `#${session.id}`
  const sets = (session.exercises || []).flatMap(e => e.sets || [])
  const vol = sets.reduce((a,x) => a + (x.reps || 0)*(x.weight_kg || 0), 0)
  const rest = hits.slice(1)
  document.getElementById('pr-root').innerHTML = `<div class="pr-overlay">
    <div class="pr-top">
      <span>NEW PERSONAL RECORD${hits.length > 1 ? ` · ${hits.length} LIFTS` : ''}</span>
      <button class="pr-x" data-act="pr-close">✕</button>
    </div>
    <div class="pr-mid">
      <div class="pr-ex">${esc(h.name.toUpperCase())}</div>
      <div class="pr-num">
        <span class="pr-kg">${fmtKg(h.kg)}</span>
        <span class="pr-unit">KG<br>× ${h.reps}</span>
      </div>
      <div class="pr-chips">
        <i>+${fmtKg(h.jump)} KG</i>
        <span>${h.prev ? `PREVIOUS BEST ${fmtKg(h.prev)} KG` : 'FIRST TIME ON RECORD'}</span>
        ${rest.length ? `<span>ALSO UP: ${rest.map(r => `${esc(r.name.toUpperCase())} ${fmtKg(r.kg)}`).join(' · ')}</span>` : ''}
      </div>
    </div>
    <div class="pr-bar">
      <span>SESSION ${no} · ${typeOf(session)} · ${sets.length} SETS${vol ? ` · ${num(Math.round(vol))} KG` : ''}</span>
      <div class="pr-bar-btns">
        <button class="pr-ghost" data-act="pr-session" data-id="${session.id}">SEE SESSION</button>
        <button class="pr-done" data-act="pr-close">DONE</button>
      </div>
    </div>
  </div>`
}

// ══════════════════════════════════════════════════════════════════════════════
// RENDER + ROUTING
// ══════════════════════════════════════════════════════════════════════════════
function render() {
  const mode = deriveMode()
  renderHeader(mode)
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  document.getElementById(`view-${tab}`).classList.add('active')
  if (tab === 'today') renderToday(mode)
  if (tab === 'training') renderTraining()
  if (tab === 'goals') renderGoals()
  if (tab === 'notes') renderNotes()
  postHeight()
}

function setTab(t, pushHash = true) {
  if (!TABS.includes(t)) t = 'today'
  tab = t
  if (pushHash) history.pushState(null, '', t === 'today' ? '#' : `#${t}`)
  render()
  document.getElementById(`view-${tab}`).scrollTop = 0
  window.scrollTo(0, 0)
  postHeight()
}

function handleHash() {
  const hash = location.hash.slice(1)
  if (hash.startsWith('session/')) {
    const id = parseInt(hash.split('/')[1])
    tab = 'training'
    render()
    if (!isNaN(id)) openSessionDetail(id, false)
    return
  }
  setTab(hash || 'today', false)
}
window.addEventListener('hashchange', handleHash)

// ══════════════════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════════════════
const LOADERS = {
  today:   async () => { todayData = await api('GET', '/api/today') || {} },
  sessions:async () => { sessions = await api('GET', '/api/sessions?detail=4') || [] },
  runs:    async () => { runs = await api('GET', '/api/runs') || [] },
  goals:   async () => { goals = await api('GET', '/api/goals') || {}; applyProfile() },
  lifts:   async () => { liftHistory = await api('GET', '/api/lift-history') || [] },
  steps:   async () => { stepsData = await api('GET', '/api/steps') || [] },
  diet:    async () => { dietData = await api('GET', '/api/diet') || [] },
  sleep:   async () => { sleepData = await api('GET', '/api/sleep') || [] },
  habits:  async () => { habitsData = await api('GET', '/api/habits') || [] },
  recovery:async () => { recoveryData = await api('GET', '/api/recovery') || [] },
  notes:   async () => { notesData = await api('GET', '/api/notes') || [] },
  prs:     async () => {
    const [all, year] = await Promise.all([api('GET', '/api/prs'), api('GET', `/api/prs?since=${YEAR_START}`)])
    prs = {}; (all || []).forEach(p => { prs[p.name.toLowerCase().trim()] = p.best_kg })
    yearPrs = {}; (year || []).forEach(p => { yearPrs[p.name.toLowerCase().trim()] = p.best_kg })
  },
  sync:    async () => {
    const [f, w] = await Promise.all([api('GET', '/api/fitbit/status'), api('GET', '/api/withings/status')])
    syncFitbit = f || { connected:false, ok:false, reconnect_url:'/auth/google-health' }
    syncWithings = w || { connected:false, ok:false, reconnect_url:'/auth/withings' }
  },
}

async function reload(keys) {
  await Promise.all(keys.map(k => LOADERS[k] ? LOADERS[k]() : null))
  render()
}

async function init() {
  await loadHubOrigin()
  await Promise.all(Object.values(LOADERS).map(fn => fn()))
  // Embed: ?tab= picks the opening tab and wins over the hash.
  const qTab = EMBED && new URLSearchParams(location.search).get('tab')
  if (TABS.includes(qTab)) setTab(qTab, false)
  else handleHash()
  watchEmbedHeight()
  postHeight()
}

// Embed: the hub switches tabs with postMessage({ type:'fitlog:tab', tab }).
// The sender must be HUB_ORIGIN. replaceState keeps the hash in step without
// adding to the parent's back history.
if (EMBED) window.addEventListener('message', e => {
  const target = parentTarget()
  if (!target || e.source !== window.parent || e.origin !== target || !e.data || e.data.type !== 'fitlog:tab' || !TABS.includes(e.data.tab)) return
  const next = e.data.tab
  setTab(next, false)
  history.replaceState(null, '', next === 'today' ? '#' : `#${next}`)
})

// Embed: a reconnect happens in another tab, so pick up the new Fitbit status
// when this window is focused or becomes visible again. No polling.
if (EMBED) {
  let fitbitRefresh = null
  const refreshFitbit = () => {
    if (document.visibilityState === 'hidden') return
    if (fitbitRefresh) return
    fitbitRefresh = (async () => {
      try {
        const f = await api('GET', '/api/fitbit/status')
        syncFitbit = f || { connected:false, ok:false, reconnect_url:'/auth/google-health' }
        render()
      } finally { fitbitRefresh = null }
    })()
  }
  window.addEventListener('focus', refreshFitbit)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshFitbit()
  })
}

// ══════════════════════════════════════════════════════════════════════════════
// EVENTS — one delegated listener, no inline handlers
// ══════════════════════════════════════════════════════════════════════════════
const ACTIONS = {
  tab: el => setTab(el.dataset.tab),
  close: () => closeModal(),
  'close-scrim': (el, e) => { if (e.target === el) closeModal() },
  'close-drawer': () => closeDrawer(),
  'open-weight': () => openWeight(),
  'open-steps': () => openSteps(),
  'open-sleep': () => openSleep(),
  'open-run': () => openRun(),
  'open-food': () => openFood(),
  'open-note': () => openNote(),
  'open-why': () => openWhy(),
  'open-goals': () => openGoals(),
  'open-pick': () => openPick(),
  'open-import': () => openImport(),
  'open-log': el => openLog(el.dataset.type || nextRotationType()),
  'save-weight': () => saveWeight(),
  'save-steps': () => saveSteps(),
  'save-sleep': () => saveSleep(sleepPick),
  'clear-sleep': () => saveSleep(0),
  'sleep-pick': el => pickSleep(+el.dataset.h),
  'save-run': () => saveRun(),
  'save-food': () => saveFood(),
  'diet-toggle': () => toggleDiet(),
  'save-note': () => saveNote(),
  'save-why': () => saveWhy(),
  'save-goals': () => saveGoals(),
  'save-session': () => saveSession(),
  'del-session': el => deleteSession(+el.dataset.id),
  'del-note': async el => { await api('DELETE', `/api/notes/${el.dataset.id}`); await reload(['notes']) },
  'note-cat': el => { noteCat = el.dataset.cat; renderNotes() },
  drawer: el => openDrawer(el.dataset.name),
  session: el => openSessionDetail(+el.dataset.id),
  reconnect: el => {
    const url = withBase(el.dataset.url || '/auth/google-health')
    if (EMBED) window.open(url, '_blank', 'noopener')
    else location.href = url
  },
  'import-preview': () => importPreview(),
  'import-confirm': () => importConfirm(),
  'pr-close': () => { closePR(); setTab('training') },
  'pr-session': el => { closePR(); setTab('training'); openSessionDetail(+el.dataset.id) },
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const act = el.dataset.act
  if (!act) return
  // A click inside the modal card must not reach the scrim behind it.
  if (act === 'close-scrim' && e.target !== el) return
  const fn = ACTIONS[act]
  if (!fn) return
  if (el.tagName !== 'A') e.preventDefault()
  fn(el, e)
})

// Log-session inputs write straight into the draft: no re-render, no lost focus.
document.addEventListener('input', e => {
  const el = e.target
  if (el.id === 'in-sess-note') { draftNote = el.value; return }
  if (el.dataset.ex == null) return
  const ex = draftLog[+el.dataset.ex]
  if (!ex) return
  if (el.dataset.f === 'note') ex.note = el.value
  else ex.sets[+el.dataset.set][el.dataset.f] = el.value
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('pr-root').innerHTML) { closePR(); return }
    if (document.getElementById('drawer-root').innerHTML) { closeDrawer(); return }
    closeModal()
    return
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    const p = modalRoot().querySelector('.modal-foot .p')
    const inside = modalRoot().contains(document.activeElement)
    if (p && inside && document.activeElement.tagName === 'INPUT') { p.click() }
  }
})

init()
</script>
</body>
</html>
